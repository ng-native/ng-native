packages:
  - 'packages/*'
  - 'examples/*'
  - 'apps/*'
  - 'template'

# A native module must exist exactly once in a build: two copies of Reanimated is two copies of
# its native side, and the second one silently does nothing. pnpm auto-installs peer dependencies,
# so `packages/components` would otherwise resolve its own - these are the versions Expo SDK 57
# bundles, and they are what `expo install --check` verifies against.
overrides:
  react: 19.2.3
  react-native: 0.86.3
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-native-gesture-handler: 2.32.0
  react-native-safe-area-context: 5.7.0
  react-native-svg: 15.15.4
  # react-native ships 0.84.5; `metro-resolver: ^0.84.5` in the tests would
  # otherwise resolve 0.84.6 and fork thirteen metro packages into two copies.
  metro-resolver: 0.84.5
  # nx pins smol-toml 1.6.1, which a malformed TOML document can hang; 1.7.1
  # is the fix and a compatible minor.
  smol-toml: ^1.7.1

# pnpm runs no install script unless a package is allowed here, and stops the install on one that
# is not decided either way. Both of these build a native binary and are the reason `nx` is fast;
# without them it falls back to a slower watcher and says nothing about why.
allowBuilds:
  '@parcel/watcher': true
  nx: true
  # Its install script only checks the platform binary that its optional dependency installs.
  esbuild: false

# Nx reads tsconfig files through TypeScript's JavaScript API, and finds `typescript` through
# pnpm's hidden hoist rather than a dependency of its own. Expo's packages auto-install TypeScript 7
# as an optional peer, which has no JavaScript API, and once it outnumbers 5.9 the hoist points at
# it and lint fails inside Nx (`readConfigFile is not a function`). A declared peer resolves to the
# root's instead.
packageExtensions:
  nx:
    peerDependencies:
      typescript: '*'
  # debug loads supports-color if it can, and takes it as an optional peer. pnpm resolves that peer
  # to whichever copy it reaches first, and the workspace has two, so every change to the lockfile
  # moved Babel and Expo between a variant on each. A dependency of its own gives it one.
  debug:
    dependencies:
      supports-color: ^8.1.1
  # @analogjs/router imports @analogjs/content only for a Markdown page, and lists it as a required
  # peer, which pnpm installs, with marked, prismjs and front-matter, for a feature a native app
  # cannot use. Optional, nothing installs it unless the app does. It also imports @angular/common,
  # @angular/platform-browser and rxjs without declaring them; as peers they resolve to the app's.
  '@analogjs/router':
    peerDependencies:
      '@angular/common': '*'
      '@angular/platform-browser': '*'
      rxjs: '*'
    peerDependenciesMeta:
      '@analogjs/content':
        optional: true
