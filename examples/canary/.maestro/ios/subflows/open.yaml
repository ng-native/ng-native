# Opens one canary screen from a freshly launched release build, by its title on the home screen.
# `SCREEN` is the title; iOS joins a row's title and blurb into one label, which the pattern allows.
appId: dev.angularnative.canary
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: 'Angular Native'
    timeout: 30000
# Brought to the middle of the screen: a row scrolled up under the translucent bar counts as on
# screen, but a tap there lands on the bar.
- runFlow:
    when:
      notVisible: '${SCREEN}(, .*)?'
    commands:
      - scrollUntilVisible:
          element: '${SCREEN}(, .*)?'
          centerElement: true
          timeout: 60000
# A tap on a list still moving from the search would only stop it.
- waitForAnimationToEnd
# A starved simulator has dropped a tap, and retryTapIfNoChange saw the screen change anyway, so
# the row is tapped again until the screen it opens is there: until the row has gone. Gone is the
# row's whole label, title and blurb, as every home row has one, so the screen's own title in its
# header does not count as the row. A tap that landed late leaves no row to tap, so a retry then
# only waits.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: '${SCREEN}, .*'
          commands:
            - tapOn:
                text: '${SCREEN}, .*'
                retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          notVisible: '${SCREEN}, .*'
          timeout: 18000
- runFlow: ../../subflows/no-error-screen.yaml
