# Answers iOS's "Open in canary?" once for an install, which a simulator asks the first time an app
# is handed a link of its scheme and not after. Run before the flows that open a screen by its link
# (subflows/open-screen.yaml), so none of them waits to see whether the dialog is there.
appId: dev.angularnative.canary
---
- runFlow:
    file: ../subflows/follow-link.yaml
    env:
      LINK: 'canary://primitives'
      SHOWS: 'Primitives'
