# CSS, as it draws: a screenshot compared with the one taken when it was last right.
appId: dev.angularnative.canary
---
- runFlow:
    file: ../subflows/open.yaml
    env:
      SCREEN: 'CSS'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-css.png
    thresholdPercentage: 99.9
# Three screens further down, one scroll at a time, so a long page is compared past its first view.
- scroll
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-css-2.png
    thresholdPercentage: 99.9
- scroll
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-css-3.png
    thresholdPercentage: 99.9
- scroll
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-css-4.png
    thresholdPercentage: 99.9
