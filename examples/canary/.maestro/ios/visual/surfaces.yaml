# Surfaces, as it draws: a screenshot compared with the one taken when it was last right.
# routes: /surfaces
appId: dev.angularnative.canary
---
- runFlow:
    file: ../subflows/open-screen.yaml
    env:
      PATH: 'surfaces'
      SHOWS: 'Surfaces'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-surfaces.png
    thresholdPercentage: 99.9
# Three screens further down, so a long page is compared past its first view. A slow drag, not a
# flick: a flick's momentum stops somewhere else each run, and the screenshot never matches.
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 3000
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-surfaces-2.png
    thresholdPercentage: 99.9
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 3000
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-surfaces-3.png
    thresholdPercentage: 99.9
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 3000
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-surfaces-4.png
    thresholdPercentage: 99.9
