# Components, as it draws: a screenshot compared with the one taken when it was last right.
# routes: /components
appId: dev.angularnative.canary
---
- runFlow:
    file: ../subflows/open-screen.yaml
    env:
      PATH: 'components?still=1'
      SHOWS: 'Components'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-components.png
    thresholdPercentage: 99.9
# Further down, by its link: `scroll` puts the page at that many points exactly (ScreenScroll),
# where a swipe lands a few points apart from one run to the next.
- openLink: 'canary://components?still=1&scroll=700'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-components-2.png
    thresholdPercentage: 99.9
- openLink: 'canary://components?still=1&scroll=1400'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-components-3.png
    thresholdPercentage: 99.9
- openLink: 'canary://components?still=1&scroll=2100'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-components-4.png
    thresholdPercentage: 99.9
