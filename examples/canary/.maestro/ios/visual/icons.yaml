# Icons, as it draws: a screenshot compared with the one taken when it was last right.
# routes: /icons
appId: dev.angularnative.canary
---
- runFlow:
    file: ../subflows/open-screen.yaml
    env:
      PATH: 'icons'
      SHOWS: 'Icons'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-icons.png
    thresholdPercentage: 99.9
# Further down, by its link: `scroll` puts the page at that many points exactly (ScreenScroll),
# where a swipe lands a few points apart from one run to the next.
- openLink: 'canary://icons?scroll=700'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-icons-2.png
    thresholdPercentage: 99.9
- openLink: 'canary://icons?scroll=1400'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-icons-3.png
    thresholdPercentage: 99.9
- openLink: 'canary://icons?scroll=2100'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-icons-4.png
    thresholdPercentage: 99.9
