# Text nesting, as it draws: a screenshot compared with the one taken when it was last right.
# routes: /text
appId: dev.angularnative.canary
---
- runFlow:
    file: ../subflows/open-screen.yaml
    env:
      PATH: 'text'
      SHOWS: 'Text nesting'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-text.png
    thresholdPercentage: 99.9
# Further down, by its link: `scroll` puts the page at that many points exactly (ScreenScroll),
# where a swipe lands a few points apart from one run to the next.
- openLink: 'canary://text?scroll=700'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-text-2.png
    thresholdPercentage: 99.9
- openLink: 'canary://text?scroll=1400'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-text-3.png
    thresholdPercentage: 99.9
- openLink: 'canary://text?scroll=2100'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-text-4.png
    thresholdPercentage: 99.9
