# Overlays: a toast above the screen, a loading cover that clears, and a toast above a sheet.
# routes: /overlays
appId: dev.angularnative.canary
---
- runFlow:
    file: subflows/open-screen.yaml
    env:
      PATH: 'overlays'
      SHOWS: 'Show a toast'
- tapOn: 'Show a toast'
- assertVisible: 'Shown above the screen'
- tapOn: 'Load for a moment'
- extendedWaitUntil:
    visible: 'Loaded'
    timeout: 5000
- tapOn: 'Open a sheet'
- tapOn: 'Show a toast'
# The sheet is modal to accessibility, so the toast above it is checked by how it looks.
- assertScreenshot:
    path: baselines/overlays-sheet-toast.png
    thresholdPercentage: 99.9
