# Does the built app start, and reach a second screen? CI runs this against the release build it
# has just compiled, so a crash at launch fails the pull request rather than reaching a user.
#
# It launches the installed app itself, not Expo Go: Expo Go carries its own native modules, so a
# module the app forgot to depend on works there and nowhere else. Run it against a release build
# (`pnpm --filter canary release:android`), which needs no Metro:
#
#     maestro test examples/canary/.maestro/release
#
# A release build that throws at startup closes, and nothing below is ever visible. A debug build
# shows the error screen instead, which the assertNotVisible lines catch. Either way it fails.
appId: ${APP_ID || 'dev.angularnative.canary'}
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: 'Angular Native'
    timeout: 30000
- runFlow: ../subflows/no-error-screen.yaml

# The native stack, from react-native-screens: push a screen and pop it with its header item.
# By deep link: the home list is longer than a scroll reliably reaches.
- runFlow:
    file: ../subflows/follow-link.yaml
    env:
      LINK: canary://navigation
      SHOWS: 'push.*'
- tapOn:
    text: 'push.*'
    retryTapIfNoChange: true
- runFlow:
    file: ../subflows/wait-for.yaml
    env:
      SHOWS: 'Detail'
# A starved CI simulator has dropped the tap on the sheet's Done, and retryTapIfNoChange saw the
# screen change anyway as the sheet settled, so the tap is tried again until the sheet is gone. A
# tap that landed late leaves no Done to tap, so a retry then only waits.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: 'Done'
          commands:
            - tapOn:
                text: 'Done'
                retryTapIfNoChange: true
      - runFlow:
          file: ../subflows/wait-for.yaml
          env:
            SHOWS: 'reset to home.*'
- tapOn:
    text: 'reset to home.*'
    retryTapIfNoChange: true
- runFlow:
    file: ../subflows/wait-for.yaml
    env:
      SHOWS: 'Angular Native'
- runFlow: ../subflows/no-error-screen.yaml

# <safe-area-view>, from react-native-safe-area-context: a native module an app has to depend on
# itself, and the one a generated app once crashed on. The search tab's content sits inside one.
- runFlow:
    file: ../subflows/follow-link.yaml
    env:
      LINK: canary://tabs
      SHOWS: 'Library'
# Each step waits for what it acts on (follow-link waits for the screen it opens). A tab bar still
# settling has dropped a tap, and retryTapIfNoChange missed it when something else on screen
# changed, so the tap is tried again while the tab's text is not there. A second tap on a tab
# already chosen does nothing.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: 'Type something, then switch tabs'
          commands:
            - tapOn:
                text: 'Search'
                retryTapIfNoChange: true
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible: 'Type something, then switch tabs'
          timeout: 18000
- runFlow: ../subflows/no-error-screen.yaml

# Tailwind utilities that combine on one element, among them an Android-only drop shadow with a
# colour class: a value native refuses closes a release build here, and the hint is never shown.
# The first hint, which is on screen on the smallest phone: the whole screen renders at once, so a
# refused value further down closes the app just the same.
- runFlow:
    file: ../subflows/follow-link.yaml
    env:
      LINK: canary://tailwind
      SHOWS: 'Rings: a colour.*'
- runFlow: ../subflows/no-error-screen.yaml
