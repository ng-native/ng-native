# Opens a canary link, as `openLink` does, confirms it on iOS, and waits for the screen it opens: a
# simulator asks before it hands a custom scheme to an app ("Open in canary?"), the first time and
# not after, and waits there until something answers. Android opens it straight away, so nothing is
# tapped there.
#
# `LINK` is the link, `canary://navigation` say; `SHOWS` is text on the screen it opens.
appId: ${APP_ID || 'dev.angularnative.canary'}
---
- openLink: ${LINK}
# On iOS the dialog or the screen comes first, and either can take a while on a loaded machine, so
# the subflow waits for whichever it is, and answers the dialog if that is what came. A loaded
# SpringBoard has dropped a tap on Open and left the dialog up, so Open is tapped until it closes.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Open|${SHOWS}'
          timeout: 30000
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible: 'Open'
                commands:
                  - tapOn: 'Open'
            - extendedWaitUntil:
                notVisible: 'Open'
                timeout: 10000
# A starved CI simulator has taken over a minute from the answer to the screen: 23s to hand the link
# to the app, then half a minute with its main thread busy mounting the screen.
- extendedWaitUntil:
    visible: '${SHOWS}'
    timeout: 90000
