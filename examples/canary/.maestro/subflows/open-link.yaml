# Opens a canary link, as `openLink` does, and confirms it on iOS: a simulator asks before it hands
# a custom scheme to an app ("Open in canary?"), and waits there until something answers. Android
# opens it straight away, so nothing is tapped there.
#
# `LINK` is the link, `canary://navigation` say.
appId: ${APP_ID || 'dev.angularnative.canary'}
---
- openLink: ${LINK}
# The dialog can take a while to appear on a loaded machine, so its button is waited for, for as
# long as a slow start takes, and a dialog that never comes fails here rather than a step later.
# Only on iOS, which always asks.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Open'
          timeout: 30000
      - tapOn: 'Open'
