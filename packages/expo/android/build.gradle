plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.ngnative.expo'
version = '1.0.0'

android {
  namespace "dev.ngnative.expo"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The first version with ProgressStyle and promoted ongoing notifications in NotificationCompat.
  implementation 'androidx.core:core:1.17.0'
  // `<search-field>`'s SearchView. React Native depends on AppCompat already.
  implementation 'androidx.appcompat:appcompat:1.7.0'
  // ReactTypefaceUtils, which finds a face expo-font registered for `<search-field>` as a text's.
  implementation 'com.facebook.react:react-android'
}
