name: Set up the workspace
description: pnpm, Node, and a frozen install. Shared by every workflow so they resolve the same tree.

inputs:
  registry-url:
    description: Passed to setup-node, which writes an .npmrc for it. Only the release sets it.
    required: false
    default: ''
  nx-cache:
    description: >-
      Names the Nx task cache to restore, for a job that runs Nx tasks and saves it from main under
      the same name. A job that does not set it restores none.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Reads the version from the root `packageManager` field, so CI and a laptop resolve the
    # same tree.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # No `cache: pnpm`: a fresh install is as quick as restoring the store (slower on macOS, which
    # also spent most of a minute saving it), and 400 MB a lockfile was most of the repository's
    # 10 GB of Actions cache, evicting the caches that do save time.
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        registry-url: ${{ inputs.registry-url }}

    # Nx's task cache, as main's latest run of the same job left it (ci.yml saves it). Each job has
    # a cache of its own name, since each holds only the tasks that job ran. Capped, so it carries
    # what recent commits built rather than growing with every one.
    - if: inputs.nx-cache != ''
      uses: actions/cache/restore@v6
      with:
        path: .nx/cache
        key: nx-${{ inputs.nx-cache }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: nx-${{ inputs.nx-cache }}-${{ runner.os }}-
    # Nx keeps its cache under the home directory unless told where: without NX_CACHE_DIRECTORY
    # there is no `.nx/cache` to restore into or to save.
    - run: |
        echo "NX_MAX_CACHE_SIZE=500MB" >> "$GITHUB_ENV"
        echo "NX_CACHE_DIRECTORY=$GITHUB_WORKSPACE/.nx/cache" >> "$GITHUB_ENV"
      shell: bash

    # Frozen: CI fails on a lockfile that does not match the manifests rather than quietly
    # resolving something newer, which is how the Reanimated version drifted off Expo's set.
    - run: pnpm install --frozen-lockfile
      shell: bash
