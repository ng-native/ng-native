name: Make a prebuilt desktop host
description: >-
  The universal prebuilt desktop host for one React Native version and flavour, packed by
  make-prebuilt.mjs into `out`.
  Shared by the release and by the Desktop host workflow's warm-up on main, so both read and write
  the same caches. In order: the last release's archive when it was built from the same inputs
  (byte for byte, no build), then a host built from the same inputs kept in the Actions cache or,
  once the cache has evicted it, as an artifact of the Desktop host workflow on main, then a build
  through ccache with the fetched sources restored. Anything that cannot be
  checked falls through to the next, and the last builds from scratch.

inputs:
  react-native:
    description: The React Native version the host is built against (HOST_REACT_NATIVE).
    required: true
  flavour:
    description: debug or release
    required: true
  version:
    description: The release the archive is named for.
    required: true
  base-url:
    description: Where the release serves the archive.
    required: true
  out:
    description: Where the archive and its manifest entry go.
    required: true
  github-token:
    description: >-
      A token with actions read access, to fetch a host the Desktop host workflow built on main
      when the Actions cache no longer has it. Empty skips that.
    default: ''

outputs:
  host-dir:
    description: >-
      The folder holding the host built from this run's inputs, for the caller to keep. Empty when
      the last release's archive was reused or nothing was kept.
    value: ${{ steps.kept.outputs.dir }}
  artifact-exists:
    description: Whether a matching host artifact was found from the Desktop host workflow on main.
    value: ${{ steps.artifact.outputs.exists }}

runs:
  using: composite
  steps:
    # The key of everything the host is built from (make-prebuilt.mjs --print-key). Empty when it
    # cannot be computed, which skips every shortcut below and builds.
    - id: key
      shell: bash
      env:
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
      run: |
        key=$(node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary --print-key --flavour "$FLAVOUR" --react-native "$REACT_NATIVE") || key=''
        echo "Host inputs key: ${key:-none}"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    # The last release's archive, when its entry in the checked-out prebuilt.json has the same key
    # and the download has its SHA-256. --reuse-only builds nothing when it cannot, so a miss or any
    # failure here goes on to the steps below with a build's caches restored.
    - id: reuse
      if: steps.key.outputs.key != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
        BASE_URL: ${{ inputs.base-url }}
        OUT: ${{ inputs.out }}
      run: |
        if node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary "$OUT" \
          --flavour "$FLAVOUR" --react-native "$REACT_NATIVE" --version "$VERSION" --base-url "$BASE_URL" \
          --reuse packages/desktop/prebuilt.json --reuse-only; then
          echo "done=true" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"
        else
          echo "Not reusing the last release's host (exit $?)."
        fi

    - id: host
      if: steps.key.outputs.key != '' && steps.reuse.outputs.done != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/prebuilt-host-${{ inputs.flavour }}
        key: desktop-prebuilt-host-${{ inputs.flavour }}-${{ steps.key.outputs.key }}

    # The Actions cache evicts by size, so the host the Desktop host workflow built on main is also
    # kept as an artifact of that run. Only push, scheduled and manual runs of desktop.yml on main
    # count, since the host goes into the release. The scheduled job checks even on a cache hit
    # so it only uploads when it needs a new artifact.
    - id: artifact
      if: >-
        steps.key.outputs.key != '' && steps.reuse.outputs.done != 'true' && inputs.github-token != '' &&
        (steps.host.outputs.cache-hit != 'true' || github.workflow == 'Desktop host')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        NAME: desktop-prebuilt-host-${{ inputs.flavour }}-${{ steps.key.outputs.key }}
        DEST: ${{ github.workspace }}/.desktop-cache
        CACHE_HIT: ${{ steps.host.outputs.cache-hit }}
      run: |
        fetch() {
          local found id run origin tmp
          found=$(gh api --paginate --slurp "repos/$REPO/actions/artifacts?name=$NAME&per_page=100" | jq -r '
            [.[].artifacts[] | select(.expired | not)
              | select(.workflow_run.head_branch == "main")
              | select(.workflow_run.head_repository_id == .workflow_run.repository_id)]
            | first // empty | "\(.id) \(.workflow_run.id)"') || return 1
          [ -n "$found" ] || { echo "No artifact $NAME from main."; return 1; }
          read -r id run <<< "$found"
          origin=$(gh api "repos/$REPO/actions/runs/$run" --jq '
            "\(.event) \(.path | sub("@(refs/heads/)?main$"; "")) \(.head_branch)"') || return 1
          case "$origin" in
            'push .github/workflows/desktop.yml main' | 'schedule .github/workflows/desktop.yml main' | 'workflow_dispatch .github/workflows/desktop.yml main') ;;
            *) echo "Artifact $id comes from '$origin', not desktop.yml on main."; return 1 ;;
          esac
          if [ "$CACHE_HIT" = true ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            return
          fi
          tmp=$(mktemp -d) || return 1
          gh api "repos/$REPO/actions/artifacts/$id/zip" > "$tmp/host.zip" &&
            unzip -q "$tmp/host.zip" -d "$tmp" &&
            mkdir -p "$DEST" &&
            tar -xzf "$tmp/host.tar.gz" -C "$DEST" || return 1
          echo "Restored the host from artifact $id of run $run."
          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        }
        if ! fetch; then echo "Not using a host from main."; fi

    # Everything a build needs, only when there is no host to pack. A cached host that fails its
    # check below still builds, without these: slower, never stale.
    - id: build
      if: >-
        steps.reuse.outputs.done != 'true' && steps.host.outputs.cache-hit != 'true' &&
        steps.artifact.outputs.restored != 'true'
      shell: bash
      run: echo "needed=true" >> "$GITHUB_OUTPUT"

    - if: steps.build.outputs.needed == 'true'
      id: target
      shell: bash
      run: echo "macos=$(packages/desktop/native/scripts/macos-target.sh)" >> "$GITHUB_OUTPUT"

    # ccache handles a universal compile (`-arch arm64 -arch x86_64`) as one, so a hit covers both
    # architectures. One set per React Native version and flavour, keyed by the pins; a near miss
    # restores the latest set of that version, then of any.
    - if: steps.build.outputs.needed == 'true'
      id: ccache
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: desktop-prebuilt-${{ inputs.flavour }}-${{ runner.os }}-rn-${{ inputs.react-native }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/fetch-hermes.sh', 'pnpm-lock.yaml') }}
        # The action adds the `-` after each prefix itself.
        restore-keys: |
          desktop-prebuilt-${{ inputs.flavour }}-${{ runner.os }}-rn-${{ inputs.react-native }}
          desktop-prebuilt-${{ inputs.flavour }}-${{ runner.os }}
        max-size: 1500M
        # Only what this build compiled is saved, so the set does not grow with every change.
        evict-old-files: job
        job-summary: ''

    - if: steps.build.outputs.needed == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/*/src
        key: desktop-src-${{ runner.os }}-rn-${{ inputs.react-native }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}

    # Whether or not a host was restored, since a cached host that fails its check builds after all.
    - if: steps.reuse.outputs.done != 'true'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: brew install ninja

    - name: Build or pack a cached host, sign it ad hoc and pack it
      if: steps.reuse.outputs.done != 'true'
      shell: bash
      env:
        NGN_DESKTOP_CACHE: ${{ github.workspace }}/.desktop-cache
        VERSION: ${{ inputs.version }}
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
        BASE_URL: ${{ inputs.base-url }}
        OUT: ${{ inputs.out }}
        KEY: ${{ steps.key.outputs.key }}
        NGN_COMPILER_LAUNCHER: ${{ steps.ccache.outcome == 'success' && 'ccache' || '' }}
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        # As in desktop.yml: keys that do not depend on where the runner put the checkout, and
        # direct mode that survives a fresh checkout's new mtimes.
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: '1'
        CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
      run: |
        start=$(date +%s)
        args=(--flavour "$FLAVOUR" --react-native "$REACT_NATIVE" --version "$VERSION" --base-url "$BASE_URL")
        # A fixed build folder, so ccache's keys match from one run to the next.
        args+=(--build-dir "$RUNNER_TEMP/ngn-prebuilt-$FLAVOUR")
        if [ -n "$KEY" ]; then
          args+=(--host-cache "$NGN_DESKTOP_CACHE/prebuilt-host-$FLAVOUR")
        fi
        node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary "$OUT" "${args[@]}"
        echo "Prebuilt $FLAVOUR host made in $(( $(date +%s) - start ))s"
        ls -l "$OUT"

    # A host built here, kept for the next run with the same inputs. make-prebuilt.mjs writes the
    # folder only after a build, with its key, so a run that packed a cached host writes nothing.
    - id: built
      if: steps.key.outputs.key != '' && steps.reuse.outputs.done != 'true' && steps.host.outputs.cache-hit != 'true'
      shell: bash
      env:
        RECORD: ${{ github.workspace }}/.desktop-cache/prebuilt-host-${{ inputs.flavour }}/host.json
        KEY: ${{ steps.key.outputs.key }}
      run: |
        if [ -f "$RECORD" ] && [ "$(jq -r .key "$RECORD")" = "$KEY" ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.built.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/prebuilt-host-${{ inputs.flavour }}
        key: desktop-prebuilt-host-${{ inputs.flavour }}-${{ steps.key.outputs.key }}

    # The kept host, built, restored or fetched, when its record names this run's key.
    - id: kept
      if: steps.key.outputs.key != '' && steps.reuse.outputs.done != 'true'
      shell: bash
      env:
        DIR: ${{ github.workspace }}/.desktop-cache/prebuilt-host-${{ inputs.flavour }}
        KEY: ${{ steps.key.outputs.key }}
      run: |
        if [ -f "$DIR/host.json" ] && [ "$(jq -r .key "$DIR/host.json")" = "$KEY" ]; then
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        fi

    - if: always() && steps.ccache.outcome == 'success'
      shell: bash
      run: ccache --show-stats
