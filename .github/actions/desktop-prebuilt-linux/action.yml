name: Make a prebuilt Linux desktop host
description: >-
  The prebuilt GTK host for one flavour and this runner's architecture, packed by
  make-prebuilt.mjs --os linux into `out`. Built in the AlmaLinux 9 image (native/docker), so it
  needs glibc 2.34 at most, which is checked on the packed host. Shared by the release and by the
  Desktop host workflow, so both read and write the same ccache. Compiles go through ccache,
  restored per architecture and flavour, falling back to the host-linux job's set; there is no
  host cache or reuse of the last release's archive as for macOS, so every run builds.

inputs:
  flavour:
    description: debug or release
    required: true
  version:
    description: The release the archive is named for.
    required: true
  base-url:
    description: Where the release serves the archive.
    required: true
  out:
    description: Where the archive and its manifest entry go, under the workspace.
    required: true
  save-cache:
    description: Whether to save this run's ccache set (only from main, so pull requests keep main's).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Build the AlmaLinux 9 image
      shell: bash
      run: docker build -t ngn-el9 packages/desktop/native/docker

    # hashFiles is not available in an action's env. The key is what the compiles read, as
    # host-linux keys its own, which a first run restores from.
    - id: ccache
      shell: bash
      env:
        FLAVOUR: ${{ inputs.flavour }}
      run: |
        echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
        echo "key=desktop-linux-prebuilt-$(uname -m)-$FLAVOUR-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/build-hermes.sh', 'packages/desktop/native/scripts/build-icu.sh', 'packages/desktop/native/docker/Dockerfile', 'pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.ccache.outputs.key }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.ccache.outputs.key }}-
          desktop-linux-prebuilt-${{ steps.ccache.outputs.arch }}-${{ inputs.flavour }}-
          desktop-linux-${{ steps.ccache.outputs.arch }}-

    - uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/*/src
        key: desktop-src-${{ runner.os }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}

    # As the runner's user, so what it writes to the workspace is the runner's. Against the canary,
    # which has every host library but react-native-webview, as the macOS hosts are.
    - name: Build the host and pack it
      shell: bash
      env:
        NGN_DESKTOP_CACHE: ${{ github.workspace }}/.desktop-cache
        NGN_COMPILER_LAUNCHER: ccache
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: '1'
        CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
        CCACHE_MAXSIZE: 1500M
        VERSION: ${{ inputs.version }}
        FLAVOUR: ${{ inputs.flavour }}
        BASE_URL: ${{ inputs.base-url }}
        OUT: ${{ github.workspace }}/${{ inputs.out }}
      run: |
        mkdir -p "$CCACHE_DIR" "$NGN_DESKTOP_CACHE" "$OUT"
        start=$(date +%s)
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e NGN_JOBS=4 \
          -e NGN_DESKTOP_CACHE -e NGN_COMPILER_LAUNCHER -e CCACHE_DIR -e CCACHE_BASEDIR \
          -e CCACHE_NOHASHDIR -e CCACHE_SLOPPINESS -e CCACHE_MAXSIZE \
          -e VERSION -e FLAVOUR -e BASE_URL -e OUT \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ngn-el9 \
          bash -euo pipefail -c '
            ccache --zero-stats > /dev/null
            node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary "$OUT" --os linux \
              --flavour "$FLAVOUR" --version "$VERSION" --base-url "$BASE_URL" \
              --build-dir /tmp/ngn-prebuilt
            ccache --show-stats
          '
        echo "Prebuilt Linux $FLAVOUR host made in $(( $(date +%s) - start ))s"
        ls -l "$OUT"

    # What the packed host links needs glibc 2.34 at most, as host-linux checks the built one.
    - name: Check the packed host's glibc floor
      shell: bash
      env:
        OUT: ${{ github.workspace }}/${{ inputs.out }}
      run: |
        unpacked="$RUNNER_TEMP/prebuilt-check-$$"
        mkdir -p "$unpacked"
        archives=("$OUT"/*-linux-*.tar.gz)
        test "${#archives[@]}" -eq 1
        tar -xzf "${archives[0]}" -C "$unpacked"
        docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$unpacked:$unpacked" \
          -w "$GITHUB_WORKSPACE/packages/desktop" ngn-el9 \
          native/docker/glibc-floor.sh 2.34 "$unpacked/gtk/ngn-linux" "$unpacked/gtk/hermesc"

    - if: inputs.save-cache == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.ccache.outputs.key }}-${{ github.run_id }}
