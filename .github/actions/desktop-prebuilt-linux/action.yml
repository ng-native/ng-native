name: Make a prebuilt Linux desktop host
description: >-
  The prebuilt GTK host for one React Native version, flavour and this runner's architecture, packed by
  make-prebuilt.mjs --os linux into `out`. Built in the AlmaLinux 9 image (native/docker), so it
  needs glibc 2.34 at most, which is checked on the packed host. Shared by the release and by the
  Desktop host workflow, so both read and write the same caches. In order, as for macOS: the last
  release's archive when it was built from the same inputs (byte for byte, no build), then a host
  built from the same inputs kept in the Actions cache, then a build through ccache, restored per
  architecture and flavour and falling back to the host-linux job's set. Anything that cannot be
  checked falls through to the next.

inputs:
  react-native:
    description: The React Native version the host is built against (HOST_REACT_NATIVE).
    required: true
  flavour:
    description: debug or release
    required: true
  version:
    description: The release the archive is named for.
    required: true
  base-url:
    description: Where the release serves the archive.
    required: true
  out:
    description: Where the archive and its manifest entry go, under the workspace.
    required: true
  save-cache:
    description: >-
      Whether to save this run's ccache set and the host it built (only from main, so pull
      requests keep main's).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Build the AlmaLinux 9 image
      shell: bash
      run: docker build -t ngn-el9 packages/desktop/native/docker

    # The key of everything the host is built from (make-prebuilt.mjs --print-key --os linux), read
    # in the image, whose compiler, glibc and libraries it covers. Empty when it cannot be computed,
    # which skips the reuse and the host cache below and builds.
    - id: key
      shell: bash
      env:
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
      run: |
        key=$(docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e FLAVOUR -e REACT_NATIVE \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ngn-el9 \
          node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary --print-key \
            --os linux --flavour "$FLAVOUR" --react-native "$REACT_NATIVE") || key=''
        echo "Host inputs key: ${key:-none}"
        echo "key=$key" >> "$GITHUB_OUTPUT"

    # The last release's archive for this architecture and flavour, when its entry in the
    # checked-out prebuilt.json has the same key and the download has its SHA-256. --reuse-only builds
    # nothing when it cannot, so a miss or any failure here goes on to the steps below.
    - id: reuse
      if: steps.key.outputs.key != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
        BASE_URL: ${{ inputs.base-url }}
        OUT: ${{ github.workspace }}/${{ inputs.out }}
      run: |
        mkdir -p "$OUT"
        if docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e VERSION -e FLAVOUR -e REACT_NATIVE -e BASE_URL -e OUT \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ngn-el9 \
          node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary "$OUT" --os linux \
            --flavour "$FLAVOUR" --react-native "$REACT_NATIVE" --version "$VERSION" --base-url "$BASE_URL" \
            --reuse packages/desktop/prebuilt.json --reuse-only; then
          echo "done=true" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"
        else
          echo "Not reusing the last release's host (exit $?)."
        fi

    - id: host
      if: steps.key.outputs.key != '' && steps.reuse.outputs.done != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/prebuilt-host-linux-${{ inputs.flavour }}
        key: desktop-prebuilt-host-linux-${{ inputs.flavour }}-${{ steps.key.outputs.key }}

    # hashFiles is not available in an action's env. The key is what the compiles read, as
    # host-linux keys its own, which a first run restores from.
    - id: ccache
      shell: bash
      env:
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
      run: |
        echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
        echo "key=desktop-linux-prebuilt-$(uname -m)-$FLAVOUR-rn-$REACT_NATIVE-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/build-hermes.sh', 'packages/desktop/native/scripts/build-icu.sh', 'packages/desktop/native/docker/Dockerfile', 'pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

    - if: steps.reuse.outputs.done != 'true' && steps.host.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.ccache.outputs.key }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.ccache.outputs.key }}-
          desktop-linux-prebuilt-${{ steps.ccache.outputs.arch }}-${{ inputs.flavour }}-rn-${{ inputs.react-native }}-
          desktop-linux-prebuilt-${{ steps.ccache.outputs.arch }}-${{ inputs.flavour }}-
          desktop-linux-${{ steps.ccache.outputs.arch }}-

    - if: steps.reuse.outputs.done != 'true' && steps.host.outputs.cache-hit != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/*/src
        key: desktop-src-${{ runner.os }}-rn-${{ inputs.react-native }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}

    # As the runner's user, so what it writes to the workspace is the runner's. Against the canary,
    # which has every host library but react-native-webview, as the macOS hosts are. A cached host
    # that fails its check builds after all.
    - name: Build or pack a cached host, and pack it
      if: steps.reuse.outputs.done != 'true'
      shell: bash
      env:
        NGN_DESKTOP_CACHE: ${{ github.workspace }}/.desktop-cache
        NGN_COMPILER_LAUNCHER: ccache
        CCACHE_DIR: ${{ github.workspace }}/.ccache
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: '1'
        CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
        CCACHE_MAXSIZE: 1500M
        VERSION: ${{ inputs.version }}
        FLAVOUR: ${{ inputs.flavour }}
        REACT_NATIVE: ${{ inputs.react-native }}
        BASE_URL: ${{ inputs.base-url }}
        OUT: ${{ github.workspace }}/${{ inputs.out }}
        HOST_CACHE: ${{ steps.key.outputs.key != '' && format('{0}/.desktop-cache/prebuilt-host-linux-{1}', github.workspace, inputs.flavour) || '' }}
      run: |
        mkdir -p "$CCACHE_DIR" "$NGN_DESKTOP_CACHE" "$OUT"
        start=$(date +%s)
        docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e NGN_JOBS=4 \
          -e NGN_DESKTOP_CACHE -e NGN_COMPILER_LAUNCHER -e CCACHE_DIR -e CCACHE_BASEDIR \
          -e CCACHE_NOHASHDIR -e CCACHE_SLOPPINESS -e CCACHE_MAXSIZE \
          -e VERSION -e FLAVOUR -e REACT_NATIVE -e BASE_URL -e OUT -e HOST_CACHE \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" ngn-el9 \
          bash -euo pipefail -c '
            ccache --zero-stats > /dev/null
            args=(--flavour "$FLAVOUR" --react-native "$REACT_NATIVE" --version "$VERSION" --base-url "$BASE_URL" --build-dir /tmp/ngn-prebuilt)
            if [ -n "$HOST_CACHE" ]; then args+=(--host-cache "$HOST_CACHE"); fi
            node packages/desktop/native/scripts/make-prebuilt.mjs examples/canary "$OUT" --os linux "${args[@]}"
            ccache --show-stats
          '
        echo "Prebuilt Linux $FLAVOUR host made in $(( $(date +%s) - start ))s"
        ls -l "$OUT"

    # What the packed host links needs glibc 2.34 at most, as host-linux checks the built one.
    - name: Check the packed host's glibc floor
      shell: bash
      env:
        OUT: ${{ github.workspace }}/${{ inputs.out }}
      run: |
        unpacked="$RUNNER_TEMP/prebuilt-check-$$"
        mkdir -p "$unpacked"
        archives=("$OUT"/*-linux-*.tar.gz)
        test "${#archives[@]}" -eq 1
        tar -xzf "${archives[0]}" -C "$unpacked"
        docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$unpacked:$unpacked" \
          -w "$GITHUB_WORKSPACE/packages/desktop" ngn-el9 \
          native/docker/glibc-floor.sh 2.34 "$unpacked/gtk/ngn-linux" "$unpacked/gtk/hermesc"

    - if: inputs.save-cache == 'true' && steps.reuse.outputs.done != 'true' && steps.host.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.ccache
        key: ${{ steps.ccache.outputs.key }}-${{ github.run_id }}

    # A host built here, kept for the next run with the same inputs, from main only as the ccache
    # set is: an unstripped host per architecture and flavour is large. make-prebuilt.mjs writes the
    # folder only after a build, with its key, so a run that packed a cached host writes nothing.
    - id: built
      if: >-
        inputs.save-cache == 'true' && steps.key.outputs.key != '' &&
        steps.reuse.outputs.done != 'true' && steps.host.outputs.cache-hit != 'true'
      shell: bash
      env:
        RECORD: ${{ github.workspace }}/.desktop-cache/prebuilt-host-linux-${{ inputs.flavour }}/host.json
        KEY: ${{ steps.key.outputs.key }}
      run: |
        if [ -f "$RECORD" ] && [ "$(jq -r .key "$RECORD")" = "$KEY" ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.built.outputs.save == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.desktop-cache/prebuilt-host-linux-${{ inputs.flavour }}
        key: desktop-prebuilt-host-linux-${{ inputs.flavour }}-${{ steps.key.outputs.key }}
