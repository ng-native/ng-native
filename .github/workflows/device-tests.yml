name: Device tests

# The canary's in-app tests (examples/canary/src/device-tests/phone), run the way an app's would
# be: `vitest --project ios` and `--project android`, which start Metro, build the development
# build the first time, boot the simulator or emulator, and launch the app themselves. The builds
# are kept in node_modules/.cache/ng-native-device-tests. CI restores the app for the same Expo
# fingerprint and runner architecture. Compiler caches are restored only if the app needs building.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/testing/**'
      - 'packages/components/**'
      - 'packages/fabric/**'
      - 'packages/platform/**'
      - 'packages/metro/**'
      - 'examples/canary/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/device-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request, or to main, makes the older run of the same workflow pointless: the
# newest run on main is the one a release waits for. A run started by hand, or called by the Release
# workflow, has a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  ios:
    if: github.event.pull_request.draft != true
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # A build that is needed compiles through ccache, read by the generated Podfile, so only the
      # C++ whose inputs changed since the cache was saved is compiled again.
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Resolve the development build's fingerprint
        id: build
        run: |
          directory=$(node examples/canary/scripts/device-test-build-directory.mjs ios)
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${directory##*/}" >> "$GITHUB_OUTPUT"

      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.build.outputs.directory }}/*.app
          key: device-test-build-${{ runner.arch }}-${{ steps.build.outputs.fingerprint }}

      - if: steps.cached.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: device-tests-ios-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: device-tests-ios-
          max-size: 2G

      # React Native's ccache wrapper runs plain clang, silently, without CCACHE_BINARY.
      - if: steps.cached.outputs.cache-hit != 'true'
        run: echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"

      # Under the job's limit, so a run that hangs fails here and the logs below are still collected:
      # a job that reaches its own limit is cancelled, and runs no step after.
      - name: Run the device tests on a simulator
        working-directory: examples/canary
        timeout-minutes: 35
        run: npx vitest run --project ios

      # Keep a completed build even if the tests failed after installing it.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cached.outputs.cache-hit != 'true' }}
        id: built
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
        run: |
          if compgen -G "$BUILD_DIR/*.app" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ !cancelled() && steps.built.outputs.ready == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.build.outputs.directory }}/*.app
          key: device-test-build-${{ runner.arch }}-${{ steps.build.outputs.fingerprint }}

      - name: Upload the screenshots that did not match
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-ios
          path: examples/canary/src/device-tests/**/__screenshots__
          if-no-files-found: ignore

      # The pool sees only the app's stdout and whether it exited. React Native logs to os_log, which
      # is kept on the simulator, still booted, after the pool uninstalled the app.
      - name: Collect the simulator's logs
        if: failure()
        run: |
          out="$RUNNER_TEMP/simulator-logs"
          mkdir -p "$out"
          xcrun simctl spawn booted log show --last 60m --info --style compact \
            --predicate 'process == "canary" OR subsystem BEGINSWITH "com.facebook.react"' \
            > "$out/app.log" 2>&1 || true
          find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -mmin -60 \
            -exec cp {} "$out" \; 2>/dev/null || true
          { sysctl hw.ncpu hw.memsize; vm_stat; top -l 1 -n 15; } > "$out/machine.txt" 2>&1 || true

      - name: Upload the simulator's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-logs-ios
          path: ${{ runner.temp }}/simulator-logs
          if-no-files-found: ignore

  android:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The emulator's userdata partition needs more disk than the runner has left.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost

      - name: Resolve the development build's fingerprint
        id: build
        run: |
          directory=$(node examples/canary/scripts/device-test-build-directory.mjs android)
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${directory##*/}" >> "$GITHUB_OUTPUT"

      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.build.outputs.directory }}/*.apk
          key: device-test-build-${{ runner.arch }}-${{ steps.build.outputs.fingerprint }}

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - if: steps.cached.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Hardware acceleration: without KVM the emulator is software-emulated and takes minutes to
      # boot.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator is up while the script runs, and the tests find it running.
      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: cd examples/canary && npx vitest run --project android

      # Keep a completed build even if the tests failed after installing it.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.cached.outputs.cache-hit != 'true' }}
        id: built
        env:
          BUILD_DIR: ${{ steps.build.outputs.directory }}
        run: |
          if compgen -G "$BUILD_DIR/*.apk" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ !cancelled() && steps.built.outputs.ready == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.build.outputs.directory }}/*.apk
          key: device-test-build-${{ runner.arch }}-${{ steps.build.outputs.fingerprint }}

      - name: Upload the screenshots that did not match
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-android
          path: examples/canary/src/device-tests/**/__screenshots__
          if-no-files-found: ignore
