name: CI telemetry

# Sends each closed pull request to Coralogix through scripts/ci-telemetry.mjs, run from the base
# repository's default branch, never code from a pull request, which is what makes the secret safe to
# use for runs from forks. Workflow runs go out in batches from telemetry-runs.yml.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  send:
    if: github.repository == 'coralogix/ng-native'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci-telemetry.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          CORALOGIX_SEND_DATA_KEY: ${{ secrets.CORALOGIX_SEND_DATA_KEY }}
          CORALOGIX_INGRESS: ${{ vars.CORALOGIX_INGRESS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CLOSED_AT: ${{ github.event.pull_request.closed_at }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: node scripts/ci-telemetry.mjs pr "$PR_NUMBER" --closed-at="$PR_CLOSED_AT" --merged="$PR_MERGED"
