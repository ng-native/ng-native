name: Native builds

# The canary, prebuilt and compiled for both platforms: the one check that a native dependency, a
# pod, or a Gradle setting still builds. On Android the release build is then launched on an
# emulator and driven through a short Maestro flow, because an app that builds can still crash
# the moment it opens: a runtime feature Hermes lacks, or a native module nobody linked.
#
# Both halves run on every pull request that is ready for review, on main, by hand, and when the
# release workflow calls this before publishing. Each launches a release build, which carries its
# bundle, and walks examples/canary/.maestro/release: iOS on a simulator, Android on an emulator.
# Both are built to be quick: each app is kept by Expo's fingerprint of its native half, so a run
# that changes only JavaScript puts a new bundle into the kept app; and a build that is needed is
# one architecture, with a cache that carries the compiled C++ (ccache on iOS, Gradle's on
# Android).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Words alone cannot break a build or a launch, and nor can what the canary does not use: the
    # generators, the migrations, tests, and the other workflows. A push to main runs it whatever
    # changed.
    paths-ignore:
      - '**/*.md'
      - 'apps/documentation/**'
      - 'packages/integration-tests/**'
      - 'packages/migrate/**'
      - 'packages/nx/**'
      - 'packages/schematics/**'
      - 'template/**'
      - 'scripts/**'
      - '**/*.test.ts'
      - '.github/workflows/ci.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/latest.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/triage.yml'
      - '.nx/version-plans/**'
  workflow_dispatch:
  workflow_call:

# A newer push to a pull request makes the older run pointless; any other run is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release build, then launched on a simulator and walked through the release flows, then its
  # screenshots, on the same simulator: see examples/canary/scripts/ios-tests.sh. On a push to
  # main, every flow's screenshots are recorded and cached by main's commit and the simulator. On a
  # pull request, the flows native-output names are compared with those of the main it was merged
  # with, so a difference is the change and not a runtime or a baseline recorded long ago;
  # screens-comment.yml shows what differs. Where main's are not cached, main's own build is
  # recorded first, in the same sitting.
  ios:
    if: github.event.pull_request.draft != true
    runs-on: macos-latest
    # The build, cold, is most of it; with a cached app, only today's bundle is. Then the smoke flow
    # and the flows compared: every flow, recorded on main or with a changed native half.
    timeout-minutes: 75
    env:
      # Read by the generated Podfile: pods are built through ccache, so a run recompiles only the
      # C++ whose inputs changed since the cache was saved.
      USE_CCACHE: '1'
      # Where ccache keeps what it compiled, which is the directory ccache-action restores and
      # saves. The action also writes it into ccache's own config file, but React Native's compiler
      # wrapper (ccache-clang.sh) points ccache at a config file of its own, so without these every
      # compile goes to a default directory that nothing saves, and each run starts from nothing.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      PR: ${{ github.event_name == 'pull_request' }}
      PUSH: ${{ github.event_name == 'push' }}
    # It runs the pull request's code: no token kept in the checkout, and nothing it may write.
    # And reads what native-output, beside it, chose.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Minutes on CI's Mac with nothing to do with the app: a simulator's first boot, and Maestro's
      # driver installed on it and started. Begun now, in the background, so they pass while the app
      # builds; the tests wait for it.
      - name: Boot a simulator while the app builds
        run: (./examples/canary/scripts/ios-warm.sh "$RUNNER_TEMP/udid" > "$RUNNER_TEMP/warm.log" 2>&1 &)

      # The app's native half is most of the job's time; its JavaScript is a minute. So the app is
      # cached by Expo's fingerprint of everything native, and a run whose fingerprint has been
      # built before puts today's bundle into that app rather than building it again. See
      # examples/canary/scripts/ios-app.mjs.
      - id: fingerprint
        working-directory: examples/canary
        run: echo "hash=$(node scripts/ios-app.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/app-cache
          key: canary-app-${{ runner.os }}-${{ steps.fingerprint.outputs.hash }}

      - name: Put today's bundle into the cached app
        if: steps.cached.outputs.cache-hit == 'true'
        working-directory: examples/canary
        run: node scripts/ios-app.mjs rebundle "$RUNNER_TEMP/app-cache/canary.app" "$RUNNER_TEMP/canary.app"

      - if: steps.cached.outputs.cache-hit != 'true'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ios-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ios-
          max-size: 2G

      # React Native's compiler wrapper runs `$CCACHE_BINARY clang` with CCACHE_BINARY read from the
      # environment. The Podfile sets it only as an Xcode build setting, which a compiler never
      # sees, so without this the wrapper runs clang on its own and nothing is cached.
      - if: steps.cached.outputs.cache-hit != 'true'
        run: echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"

      # `ios/` and `android/` are generated, not committed. Prebuild also installs the pods.
      - if: steps.cached.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform ios --clean
        working-directory: examples/canary

      # A simulator build needs no signing, which is what makes this runnable without secrets.
      # Release, so the bundle is in the app and it launches with no Metro, as a user's does.
      - name: Build for the simulator
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: examples/canary/ios
        run: |
          # xcbeautify (on the runner image) prints one line per compiled file as it goes, so the
          # log shows progress, and turns errors and warnings into annotations.
          command -v xcbeautify > /dev/null || brew install xcbeautify
          # One architecture: arm64, the simulator on every current Mac. The generic destination
          # otherwise compiles every pod twice, once more for Intel.
          xcodebuild -workspace canary.xcworkspace -scheme canary -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build \
            | xcbeautify --renderer github-actions
          exit "${PIPESTATUS[0]}"

      - if: steps.cached.outputs.cache-hit != 'true'
        run: ccache --show-stats

      - name: Keep the app for runs with the same native half
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/app-cache"
          cp -R examples/canary/ios/build/Build/Products/Release-iphonesimulator/canary.app "$RUNNER_TEMP/app-cache/"
          cp -R "$RUNNER_TEMP/app-cache/canary.app" "$RUNNER_TEMP/canary.app"

      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/app-cache
          key: canary-app-${{ runner.os }}-${{ steps.fingerprint.outputs.hash }}

      # For update-screenshots.yml, which records the baselines from it: a cache a pull request's
      # run saves is its own, out of that workflow's reach. A tarball, which keeps the executables
      # executable, as an artifact does not.
      - name: Keep the app for update-screenshots.yml
        run: tar -czf "$RUNNER_TEMP/canary-app.tgz" -C "$RUNNER_TEMP" canary.app
      - uses: actions/upload-artifact@v7
        with:
          name: canary-ios-app
          path: ${{ runner.temp }}/canary-app.tgz
          retention-days: 7

      # Main's screenshots are of a simulator and a commit: on a pull request, of the main it was
      # merged with, the merge's first parent.
      - id: screens
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$GITHUB_SHA
          [ "$PR" = false ] || main=$(git rev-parse HEAD^1)
          simulator=$(./examples/canary/scripts/ios-simulator.sh --which | tr ' ' '-')
          echo "key=canary-screens-$simulator-$main" >> "$GITHUB_OUTPUT"
          [ "$PR" = true ] || exit 0
          # The flows native-output chose, beside this job: once it has finished, or every flow
          # where it failed or is not done in ten minutes.
          state=pending
          for _ in $(seq 120); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
              --jq '.jobs[] | select(.name == "native-output") | .conclusion // "pending"') || state=pending
            [ "$state" = pending ] || break
            sleep 5
          done
          if [ "$state" = success ] && gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" \
            -n screens-native-output -D "$RUNNER_TEMP/native" && [ -f "$RUNNER_TEMP/native/flows.txt" ]; then
            flows=$(cat "$RUNNER_TEMP/native/flows.txt")
          else
            flows=$(node examples/canary/.maestro/ios/compare-builds.mjs flows | paste -sd, -)
          fi
          echo "flows=$flows" >> "$GITHUB_OUTPUT"
          echo "Screenshot flows to compare: ${flows:-none}"

      - id: main-shots
        if: env.PR == 'true' && steps.screens.outputs.flows != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/main-screens
          key: ${{ steps.screens.outputs.key }}

      # Main's screenshots not cached, its run not finished or gone: main's own build, recorded
      # in this sitting. Its bundle in an app of its native half: the change's app where the change
      # leaves that half as it was, or the app main's run cached.
      - id: base
        if: env.PR == 'true' && steps.screens.outputs.flows != '' && steps.main-shots.outputs.cache-hit != 'true'
        run: echo "needed=true" >> "$GITHUB_OUTPUT"
      - id: base-fingerprint
        if: steps.base.outputs.needed
        run: |
          # The change's own app went into app-cache above, and is in canary.app now: main's is
          # restored there next, and the two would mix.
          rm -rf "$RUNNER_TEMP/app-cache"
          git worktree add --detach "$RUNNER_TEMP/base" "$(git rev-parse HEAD^1)"
          pnpm --dir "$RUNNER_TEMP/base" install --frozen-lockfile --prefer-offline
          echo "base=$(cd "$RUNNER_TEMP/base/examples/canary" && node scripts/ios-app.mjs fingerprint)" >> "$GITHUB_OUTPUT"
          echo "change=$(cd examples/canary && node scripts/ios-app.mjs fingerprint)" >> "$GITHUB_OUTPUT"
      - id: base-app
        if: steps.base.outputs.needed && steps.base-fingerprint.outputs.base != steps.base-fingerprint.outputs.change
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/app-cache
          key: canary-app-${{ runner.os }}-${{ steps.base-fingerprint.outputs.base }}
      - name: Put main's bundle into its app
        if: steps.base.outputs.needed
        env:
          SAME: ${{ steps.base-fingerprint.outputs.base == steps.base-fingerprint.outputs.change }}
          CACHED: ${{ steps.base-app.outputs.cache-hit }}
        run: |
          shell=
          if [ "$SAME" = true ]; then shell=$RUNNER_TEMP/canary.app
          elif [ "$CACHED" = true ]; then shell=$RUNNER_TEMP/app-cache/canary.app
          fi
          # None: the change touches the native half, and no app of main's is cached. ios-tests.sh
          # says so in the report.
          [ -n "$shell" ] || exit 0
          cd "$RUNNER_TEMP/base/examples/canary"
          node scripts/ios-app.mjs rebundle "$shell" "$RUNNER_TEMP/base.app"

      - name: Launch it on a simulator, and compare its screenshots
        env:
          FLOWS: ${{ steps.screens.outputs.flows }}
        run: |
          # Called by the release workflow or by hand: the smoke flow alone.
          if [ "$PR" = true ]; then
            export FLOWS BASE_SHOTS=$RUNNER_TEMP/main-screens BASE_APP=$RUNNER_TEMP/base.app
          elif [ "$PUSH" = true ]; then
            export RECORD_INTO=$RUNNER_TEMP/main-screens
          fi
          # The simulator booting since the build began, and Maestro's driver on it.
          for _ in $(seq 360); do [ -f "$RUNNER_TEMP/udid.done" ] && break; sleep 5; done
          cat "$RUNNER_TEMP/warm.log"
          UDID=$(cat "$RUNNER_TEMP/udid") || exit 1
          export UDID
          ./examples/canary/scripts/ios-tests.sh "$RUNNER_TEMP/canary.app" "$RUNNER_TEMP/out"

      - if: env.PUSH == 'true' && success()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/main-screens
          key: ${{ steps.screens.outputs.key }}

      - name: Say which pull request it is for
        if: always() && env.PR == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/out/screens"
          # A job stopped before ios-tests.sh wrote a report compared nothing, and says so: the
          # comment then does not take its silence for no difference.
          [ -f "$RUNNER_TEMP/out/screens/report.json" ] \
            || echo '{"flows":0,"compared":false,"differ":[]}' > "$RUNNER_TEMP/out/screens/report.json"
          printf '{"number":%s,"head":"%s"}\n' "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/out/screens/pr.json"
      - uses: actions/upload-artifact@v7
        if: always() && env.PR == 'true'
        with:
          name: screens-ios
          path: ${{ runner.temp }}/out/screens
          retention-days: 7

      - name: Upload what Maestro saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: ${{ runner.temp }}/out/maestro
          if-no-files-found: ignore

  # What each canary screen sends native, on the base and on the pull request, and each view and
  # prop that differs, for the comment screens-comment.yml writes. A changed screen is often the
  # point of the change, so it does not fail the run; a comparison that could not be made does.
  # Linux, beside `ios`: it also says which screenshot flows `ios` compares, those of the screens
  # that changed, or every flow where the native half did.
  native-output:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # It runs the pull request's install and scripts: no token kept in the checkout, and nothing
    # it may write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Main as the pull request was merged with for this run: the checkout is that merge, and its
      # first parent is main. The event's base.sha can be older, the commit the branch started from.
      - name: Check out and install the base
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$(git rev-parse HEAD^1)"
          pnpm --dir "$RUNNER_TEMP/base" install --frozen-lockfile --prefer-offline

      - name: Write what each screen sends native, on each side
        run: |
          node scripts/native-output.mjs write "$RUNNER_TEMP/screens/base" --checkout "$RUNNER_TEMP/base"
          node scripts/native-output.mjs write "$RUNNER_TEMP/screens/change"

      # 0 is no change and 1 a change, both for review; 2, or anything else, is a comparison that
      # could not be made.
      - name: Compare them
        run: |
          mkdir -p "$RUNNER_TEMP/comment"
          code=0
          node scripts/native-output.mjs diff "$RUNNER_TEMP/screens/base" "$RUNNER_TEMP/screens/change" \
            > "$RUNNER_TEMP/native-output.md" || code=$?
          cat "$RUNNER_TEMP/native-output.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/native-output.md"
          [ "$code" -le 1 ]
          node scripts/native-output.mjs diff "$RUNNER_TEMP/screens/base" "$RUNNER_TEMP/screens/change" \
            --json > "$RUNNER_TEMP/comment/native-output.json" || [ $? -le 1 ]

      # A screen's screenshots can change only where what it sends native did, or where the app's
      # native half did, which can change any screen. Each side's fingerprint on this one runner,
      # so they compare, whatever the Mac's would be.
      - id: flows
        run: |
          base=$(cd "$RUNNER_TEMP/base/examples/canary" && node scripts/ios-app.mjs fingerprint)
          change=$(cd examples/canary && node scripts/ios-app.mjs fingerprint)
          compare=examples/canary/.maestro/ios/compare-builds.mjs
          if [ "$base" != "$change" ]; then
            flows=$(node "$compare" flows | paste -sd, -)
          else
            routes=$(jq -r '[.results[] | select(.missing or (.changes | length > 0) or ((.notes // []) | length > 0)) | .url] | join(",")' \
              "$RUNNER_TEMP/comment/native-output.json")
            flows=
            [ -z "$routes" ] || flows=$(node "$compare" flows --routes "$routes" | paste -sd, -)
          fi
          echo "$flows" > "$RUNNER_TEMP/comment/flows.txt"
          echo "Screenshot flows to compare: ${flows:-none}"

      # Which pull request and commit it is for, which screens-comment.yml checks before using.
      # Always: a comparison that did not finish says so in the comment.
      - name: Say which pull request it is for
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/comment"
          printf '{"number":%s,"head":"%s"}\n' "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/comment/pr.json"

      # For screens-comment.yml, which comments with it: a pull request's own run cannot, as one from
      # a fork has no token that writes.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screens-native-output
          path: ${{ runner.temp }}/comment
          retention-days: 7

  android:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # The build, cold, is most of it; the emulator and the flow add about five minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The APK's native half is most of twenty minutes of C++; its JavaScript is one minute. So the
      # APK is cached by Expo's fingerprint of everything native, and a run whose fingerprint has
      # been built before puts today's bundle into that APK rather than building it again. See
      # examples/canary/scripts/android-apk.mjs.
      - id: fingerprint
        working-directory: examples/canary
        run: echo "hash=$(node scripts/android-apk.mjs fingerprint)" >> "$GITHUB_OUTPUT"

      - id: cached
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/apk-cache
          key: canary-apk-${{ runner.os }}-${{ steps.fingerprint.outputs.hash }}

      # Exits 3 when the app's images changed, which are compiled into the APK's resources and
      # cannot be swapped like the bundle; the build below runs then instead.
      - id: rebundle
        if: steps.cached.outputs.cache-hit == 'true'
        continue-on-error: true
        working-directory: examples/canary
        run: >
          node scripts/android-apk.mjs rebundle
          "$RUNNER_TEMP/apk-cache/canary.apk" "$RUNNER_TEMP/apk-cache/assets.json"
          "$RUNNER_TEMP/apk-cache/debug.keystore" "$RUNNER_TEMP/canary.apk"

      # The emulator's userdata partition needs more disk than the runner has left, build or no
      # build, so the toolchains the runner ships and this job never uses (.NET, Haskell, CodeQL,
      # Swift, Boost) go first.
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/share/boost
          df -h "$GITHUB_WORKSPACE"

      # The emulator's system image, which is otherwise a 45-second download on every run. After
      # the disk is freed, since it adds to what the emulator needs.
      - uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images/android-34/google_apis/x86_64
          key: android-system-image-34-google_apis-x86_64

      - if: steps.rebundle.outcome != 'success'
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17

      - if: steps.rebundle.outcome != 'success'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - if: steps.rebundle.outcome != 'success'
        run: npx expo prebuild --platform android --clean
        working-directory: examples/canary

      - name: Assemble a release build
        if: steps.rebundle.outcome != 'success'
        working-directory: examples/canary/android
        # Without the release lint: it analyses every library's sources for fatal issues, half a
        # minute of the build, and none of that code is ours to fix.
        run: >
          ./gradlew assembleRelease --build-cache -x lintVitalRelease
          -PreactNativeArchitectures=x86_64
          -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"

      # What a later run needs to reuse this build: the APK, the key it is signed with, and the
      # list of assets it ships, which is what decides whether a bundle can be swapped into it.
      - name: Keep the APK, drop the build's intermediates
        if: steps.rebundle.outcome != 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/apk-cache"
          cp examples/canary/android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/canary.apk"
          cp "$RUNNER_TEMP/canary.apk" "$RUNNER_TEMP/apk-cache/canary.apk"
          cp examples/canary/android/app/debug.keystore "$RUNNER_TEMP/apk-cache/debug.keystore"
          (cd examples/canary && node scripts/android-apk.mjs assets "$RUNNER_TEMP/apk-cache/assets.json")
          ./examples/canary/android/gradlew -p examples/canary/android --stop
          find examples/canary/android node_modules/.pnpm -type d \
            \( -path '*/android/build' -o -path '*/android/app/build' -o -name .cxx \) -prune -exec rm -rf {} +
          df -h "$GITHUB_WORKSPACE"

      - if: steps.rebundle.outcome != 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/apk-cache
          key: canary-apk-${{ runner.os }}-${{ steps.fingerprint.outputs.hash }}

      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | MAESTRO_VERSION=2.10.0 bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Hardware acceleration: without KVM the emulator is software-emulated and takes minutes
      # to boot, where with it this is well under one.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Launches the APK and walks examples/canary/.maestro/release: the first screen, a push and
      # a pop on the native stack, and a screen inside <safe-area-view>. A crash at launch fails
      # it, as does React Native's error screen or an unimplemented native view.
      - name: Launch it on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A boot that has not finished in three minutes will not.
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: ./examples/canary/scripts/smoke-android.sh "$RUNNER_TEMP/canary.apk" "$RUNNER_TEMP/maestro"

      - name: Upload what Maestro saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android
          path: ${{ runner.temp }}/maestro
          if-no-files-found: ignore
