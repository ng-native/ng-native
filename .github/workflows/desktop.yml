name: Desktop host

# The desktop host in @ng-native/desktop. On ubuntu, the toolkit-free core and its tests build with
# no backend and no Hermes, which proves AppKit never leaks into the core. On macOS, the AppKit host
# builds as an app would build it, and the core tests run there too. Only when the host or what it
# builds from could have changed; a push to main runs it whatever changed.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/desktop/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The per-user build cache, moved where actions/cache can keep it.
  NGN_DESKTOP_CACHE: ${{ github.workspace }}/.desktop-cache
  NGN_JOBS: '4'

jobs:
  core-linux:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # React Native's renderer and the core, cold, are a few minutes on four cores.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: sudo apt-get install -y --no-install-recommends ninja-build lld

      # The fetched sources only, keyed by the pins: a build directory is cheap to remake and
      # large to keep.
      - uses: actions/cache@v6
        with:
          path: ${{ env.NGN_DESKTOP_CACHE }}/*/src
          key: desktop-src-${{ runner.os }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}

      - name: Build the core and run its tests on the fake backend
        env:
          CC: clang
          CXX: clang++
        run: pnpm --filter @ng-native/desktop test:native

  host-macos:
    if: github.event.pull_request.draft != true
    runs-on: macos-latest
    # Budget: a cold dev build within 10 minutes on this runner (spec, performance budget).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Build tools only; every library the host links comes from the pinned sources.
      - run: brew install ninja

      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.NGN_DESKTOP_CACHE }}/*/src
            ${{ env.NGN_DESKTOP_CACHE }}/*/hermes-*
          key: desktop-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/build-hermes.sh', 'pnpm-lock.yaml') }}

      - name: Build the AppKit host
        shell: bash
        run: |
          start=$(date +%s)
          build=$(pnpm --silent --filter @ng-native/desktop build:host | tail -n 1)
          echo "Host built in $(( $(date +%s) - start ))s"
          test -x "$build/appkit/ngn-macos"
          # Linked statically: nothing but the system's own libraries and frameworks.
          if otool -L "$build/appkit/ngn-macos" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "ngn-macos links a library from outside the system" >&2
            exit 1
          fi
          echo "BUILD_DIR=$build" >> "$GITHUB_ENV"

      - name: Run the core tests
        run: '"$BUILD_DIR/ngn_core_tests"'
