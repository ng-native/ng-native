name: Desktop host

# The desktop host in @ng-native/desktop. On ubuntu, the toolkit-free core and its tests build with
# no backend and no Hermes, which proves AppKit never leaks into the core. In the AlmaLinux 9 image
# (native/docker), on x86_64 and arm64, the GTK host builds over Hermes with a static ICU, its tests
# run (the GTK view tests under Xvfb), what it links needs glibc 2.34 at most, and it is launched on
# an example app's bundle to its first frame under Xvfb and headless Weston.
# On macOS, the AppKit host
# builds as an app would build it, the core tests run there too, and the built host is launched on an
# example app's bundle to its first frame. A pull request runs it only when
# the host or the workflow changed, or the lockfile moved the version of a package the host builds
# from (see `changes`); a push to main and a manual run build it whatever changed. Compiles go
# through ccache, kept per job and saved only from main, which every pull request restores: a set
# saved per pull request run filled the repository's 10 GB of Actions cache and evicted main's.
#
# On main, `prebuilt-host` also makes both universal prebuilt hosts the release publishes, and
# `prebuilt-host-linux` the Linux ones for x86_64 and arm64, when anything they are built from
# changed, so the release finds their caches warm. A manual run makes the Linux ones on any branch.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The per-user build cache, moved where actions/cache can keep it.
  NGN_DESKTOP_CACHE: ${{ github.workspace }}/.desktop-cache
  NGN_JOBS: '4'
  # Read by the build scripts: every compile of the host and of Hermes goes through ccache.
  NGN_COMPILER_LAUNCHER: ccache
  # Where ccache keeps what it compiled, which is the directory ccache-action restores and saves.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  # Absolute paths under the workspace are made relative and the working directory is not hashed,
  # so a compile's key does not depend on where the runner put the checkout.
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: '1'
  # A fresh checkout gives every header a new mtime and ctime, and `__DATE__` and `__TIME__` are
  # not used on purpose: without these, direct mode would miss every run.
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros

jobs:
  # Which parts of the tree a pull request, or a push to main, touched. The checks below build on
  # every push and manual run anyway; on a push, `prebuilt-host` reads it.
  changes:
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      pins: ${{ steps.pins.outputs.pins }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop:
              - 'packages/desktop/**'
              - '.github/workflows/desktop.yml'
              - 'scripts/desktop-host-pins.mjs'
              - '.github/actions/desktop-prebuilt/**'

      # A lockfile edit reaches the host only through the version of a package it builds from.
      - id: pins
        if: steps.filter.outputs.desktop != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          node scripts/desktop-host-pins.mjs "$BASE_SHA"

  core-linux:
    needs: changes
    if: >-
      always() && github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.pins == 'true')
    runs-on: ubuntu-latest
    # React Native's renderer and the core, cold, are a few minutes on four cores.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: sudo apt-get install -y --no-install-recommends ninja-build lld

      # Keyed by the pins the compiles read, so a bump of any starts a fresh set; a near miss
      # restores the latest, which still holds every file the change did not reach.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: desktop-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}
          restore-keys: desktop-core-${{ runner.os }}-${{ runner.arch }}-
          max-size: 500M
          save: ${{ github.event_name != 'pull_request' }}

      # The fetched sources only, keyed by the pins: a build directory is cheap to remake and
      # large to keep.
      - uses: actions/cache@v6
        with:
          path: ${{ env.NGN_DESKTOP_CACHE }}/*/src
          key: desktop-src-${{ runner.os }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}

      - name: Build the core and run its tests on the fake backend
        env:
          CC: clang
          CXX: clang++
        run: pnpm --filter @ng-native/desktop test:native

      - if: always()
        run: ccache --show-stats

  # The Linux build with the GTK backend, in the AlmaLinux 9 image so its glibc is the floor. The image
  # is built on each run from native/docker: a few minutes of dnf, against a 2 GB image per
  # architecture that would take much of the repository's 10 GB of Actions cache. The workspace,
  # installed on the runner, is mounted at its own path, and the build runs as the runner's user,
  # not root, since root reads the files the core tests make unreadable.
  host-linux:
    name: host-linux (${{ matrix.arch }})
    needs: changes
    if: >-
      always() && github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.pins == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The ccache key, by what the compiles read: the pins, how Hermes and ICU build, and the image.
      # hashFiles is not available in a job's env.
      - id: ccache
        run: echo "key=desktop-linux-${{ matrix.arch }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/build-hermes.sh', 'packages/desktop/native/scripts/build-icu.sh', 'packages/desktop/native/docker/Dockerfile', 'pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Build the AlmaLinux 9 image
        run: docker build -t ngn-el9 packages/desktop/native/docker

      # Restored on every run and saved only from main, under a new key each time, as ccache-action
      # does on the other jobs (it installs ccache on the runner, not in the image). A near miss
      # restores the latest set.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.ccache.outputs.key }}-
            desktop-linux-${{ matrix.arch }}-

      - uses: actions/cache@v6
        with:
          path: ${{ env.NGN_DESKTOP_CACHE }}/*/src
          key: desktop-src-${{ runner.os }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'pnpm-lock.yaml') }}

      # The GTK host and its tests: the core and runtime tests as they are, the GTK view tests under
      # Xvfb, which needs no window manager and draws with Mesa's software GL.
      - name: Build the GTK host and run its tests
        run: |
          mkdir -p "$CCACHE_DIR" "$NGN_DESKTOP_CACHE" "$GITHUB_WORKSPACE/.linux-probe"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e NGN_DESKTOP_CACHE -e NGN_JOBS -e NGN_COMPILER_LAUNCHER -e GITHUB_WORKSPACE \
            -e CCACHE_DIR -e CCACHE_BASEDIR -e CCACHE_NOHASHDIR -e CCACHE_SLOPPINESS -e CCACHE_MAXSIZE \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/desktop" ngn-el9 \
            bash -euo pipefail -c '
              ccache --zero-stats > /dev/null
              start=$(date +%s)
              build=$(native/scripts/build.sh --backend gtk --no-debug-info | tail -n 1)
              echo "Built in $(( $(date +%s) - start ))s"
              ccache --show-stats
              echo "$build" > "$GITHUB_WORKSPACE/.linux-probe/build-dir"
              "$build/ngn_core_tests"
              "$build/ngn_runtime_tests"
              Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &
              xvfb=$!
              trap "kill $xvfb" EXIT
              mkdir -p "$GITHUB_WORKSPACE/.linux-probe/gtk-tests"
              DISPLAY=:99 GDK_BACKEND=x11 NGN_GTK_TEST_SHOTS="$GITHUB_WORKSPACE/.linux-probe/gtk-tests" \
                "$build/gtk/ngn_gtk_tests"
              native/docker/glibc-floor.sh 2.34 "$build/ngn_core_tests" "$build/ngn_runtime_tests" "$build/gtk/ngn-linux" \
                "$NGN_DESKTOP_CACHE"/*/hermes-$(uname -m)/bin/hermesc
            '

      # A .deb depends on DEB_DEPENDS and nothing else: with only those installed in a clean Ubuntu
      # 24.04, every library the built host loads must be found. (An rpm's requirements are
      # rpmbuild's own, read from the binary.)
      - name: Check the deb's dependencies against the host
        working-directory: packages/desktop
        run: |
          packages=$(node -e "import('./bin/package-linux.mjs').then((m) => console.log(m.DEB_DEPENDS.map((d) => d.split(' ')[0]).join(' ')))")
          test -n "$packages"
          host="$(cat "$GITHUB_WORKSPACE/.linux-probe/build-dir")/gtk/ngn-linux"
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" ubuntu:24.04 \
            "$PWD/native/scripts/deb-depends-check.sh" "$host" $packages

      # The host launched on the notes example's release bundle to its first frame, under Xvfb (X11)
      # and headless Weston (Wayland), as launch-probe.sh checks it: a commit, a first frame, no crash
      # and no JavaScript error, then read over AT-SPI (atspi-check.py). The bundle is the Linux one,
      # as a Linux package carries it. Each launch saves its window, drawn in-process, for the
      # artifact below.
      - name: Launch the GTK host on an app
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          probe="$GITHUB_WORKSPACE/.linux-probe"
          (cd examples/notes && pnpm exec expo export:embed --platform linux --dev false \
            --bundle-output "$probe/notes/main.js" --assets-dest "$probe/notes/assets")
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e NGN_DESKTOP_CACHE -e GITHUB_WORKSPACE \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/desktop" ngn-el9 \
            bash -euo pipefail -c '
              probe="$GITHUB_WORKSPACE/.linux-probe"
              host="$(cat "$probe/build-dir")/gtk/ngn-linux"
              export GTK_A11Y=none
              Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &
              xvfb=$!
              DISPLAY=:99 GDK_BACKEND=x11 NGN_CAPTURE="$probe/x11.png" \
                native/scripts/launch-probe.sh "$host" "$probe/notes/main.js"
              kill $xvfb
              export XDG_RUNTIME_DIR="$(mktemp -d)"
              weston --backend=headless-backend.so --use-pixman --socket=ngn-wayland --width=1280 --height=800 \
                > "$probe/weston.log" 2>&1 &
              weston=$!
              for _ in $(seq 50); do [ -S "$XDG_RUNTIME_DIR/ngn-wayland" ] && break; sleep 0.2; done
              WAYLAND_DISPLAY=ngn-wayland GDK_BACKEND=wayland NGN_CAPTURE="$probe/wayland.png" \
                native/scripts/launch-probe.sh "$host" "$probe/notes/main.js"
              kill $weston
            '
          # The same app read over AT-SPI as a screen reader reads it: its buttons and its text, each
          # named. As root: dbus-daemon will not start for a user the image has no passwd entry for.
          docker run --rm -e GITHUB_WORKSPACE \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE/packages/desktop" ngn-el9 \
            bash -euo pipefail -c '
              probe="$GITHUB_WORKSPACE/.linux-probe"
              Xvfb :99 -screen 0 1280x800x24 -nolisten tcp > /dev/null 2>&1 &
              DISPLAY=:99 GDK_BACKEND=x11 dbus-run-session -- python3 native/scripts/atspi-check.py \
                "$(cat "$probe/build-dir")/gtk/ngn-linux" "$probe/notes/main.js" --role "push button" --role label
            '

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-first-frame-${{ matrix.arch }}
          path: |
            .linux-probe/*.png
            .linux-probe/gtk-tests/*.png
            .linux-probe/weston.log
          if-no-files-found: ignore

      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.key }}-${{ github.run_id }}

  host-macos:
    needs: changes
    if: >-
      always() && github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.pins == 'true')
    runs-on: macos-latest
    # Budget: a cold dev build within 10 minutes on this runner (spec, performance budget).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Build tools only; every library the host links comes from the pinned sources. ccache is
      # installed by its action below.
      - run: brew install ninja

      # Hermes and React Native's renderer are most of a cold build. A build restored from here
      # recompiles only the files whose inputs changed; the key names the pins, and a near miss
      # restores the latest set.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: desktop-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/build-hermes.sh', 'pnpm-lock.yaml') }}
          restore-keys: desktop-host-${{ runner.os }}-${{ runner.arch }}-
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}

      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.NGN_DESKTOP_CACHE }}/*/src
            ${{ env.NGN_DESKTOP_CACHE }}/*/hermes-*
          key: desktop-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/desktop/native/scripts/fetch.sh', 'packages/desktop/native/scripts/build-hermes.sh', 'pnpm-lock.yaml') }}

      - name: Build the AppKit host
        shell: bash
        run: |
          start=$(date +%s)
          build=$(pnpm --silent --filter @ng-native/desktop build:host | tail -n 1)
          echo "Host built in $(( $(date +%s) - start ))s"
          test -x "$build/appkit/ngn-macos"
          # Linked statically: nothing but the system's own libraries and frameworks.
          if otool -L "$build/appkit/ngn-macos" | tail -n +2 | grep -vE '^\s+(/usr/lib/|/System/Library/)'; then
            echo "ngn-macos links a library from outside the system" >&2
            exit 1
          fi
          echo "BUILD_DIR=$build" >> "$GITHUB_ENV"

      - name: Run the core tests
        run: '"$BUILD_DIR/ngn_core_tests"'

      # Hermes and the runtime half, linked as the host links them.
      - name: Run the runtime tests
        run: '"$BUILD_DIR/ngn_runtime_tests"'

      # Views mounted through the AppKit backend into an offscreen window: accessibility and Tab.
      - name: Run the AppKit view tests
        run: '"$BUILD_DIR/appkit/ngn_appkit_tests"'

      # The host launched on the notes example's release bundle, as a packaged app runs one: it must
      # commit and draw its first frame without a crash or a JavaScript error (launch-probe.sh).
      - name: Launch the host on an app
        shell: bash
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          bundle="$RUNNER_TEMP/notes/main.js"
          (cd examples/notes && pnpm exec expo export:embed --platform macos --dev false \
            --bundle-output "$bundle" --assets-dest "$RUNNER_TEMP/notes/assets")
          packages/desktop/native/scripts/launch-probe.sh "$BUILD_DIR/appkit/ngn-macos" "$bundle"

      - if: always()
        run: ccache --show-stats

  # The prebuilt Linux hosts, both flavours on x86_64 and arm64, as the release makes them (the
  # same action and caches), on a push to main that changed anything they are built from, or by
  # hand on any branch. Each archive and its entry are kept as an artifact, so a branch's host can
  # be run (NGN_DESKTOP_FROM_SOURCE unset, a prebuilt.json naming it). Nothing is published.
  prebuilt-host-linux:
    name: prebuilt-host-linux (${{ matrix.arch }}, ${{ matrix.flavour }})
    needs: changes
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.desktop == 'true' || needs.changes.outputs.pins == 'true')))
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        flavour: [debug, release]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/desktop-prebuilt-linux
        with:
          flavour: ${{ matrix.flavour }}
          version: 0.0.0-main
          base-url: https://github.com/${{ github.repository }}/releases/download/main
          out: .prebuilt
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilt-host-linux-${{ matrix.arch }}-${{ matrix.flavour }}
          path: .prebuilt
          include-hidden-files: true
          if-no-files-found: error

  # Both universal prebuilt hosts, as the release makes them (the same action and caches), on a push
  # to main that changed anything they are built from, or by hand. A release on main then finds the
  # host already built, or at least ccache, Hermes and the sources warm. Nothing is uploaded.
  prebuilt-host:
    name: prebuilt-host (${{ matrix.flavour }})
    needs: changes
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || needs.changes.outputs.desktop == 'true' ||
      needs.changes.outputs.pins == 'true')
    runs-on: macos-latest
    strategy:
      matrix:
        flavour: [debug, release]
    # As the release's desktop-host: room for a build from scratch.
    timeout-minutes: 75
    env:
      NGN_JOBS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/desktop-prebuilt
        with:
          flavour: ${{ matrix.flavour }}
          version: 0.0.0-main
          base-url: https://github.com/${{ github.repository }}/releases/download/main
          out: ${{ runner.temp }}/prebuilt
