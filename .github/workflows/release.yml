name: Release

# Run by hand from the Actions tab, on main, once CI is green there. See docs/RELEASING.md.
# A dry run can start from any branch: every check and build runs, nothing leaves the runner.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'The bump: minor for a breaking change, patch otherwise'
        type: choice
        options: [minor, patch]
        required: true
        default: minor
      version:
        description: 'An exact version instead (0.19.0), above the latest on npm and on the same major. Overrides the bump.'
        required: false
        default: ''
      dry_run:
        description: 'A dry run: every check, build and pack, then `npm publish --dry-run`. Nothing is published, pushed or deployed.'
        type: boolean
        default: false

# One release at a time: two would race for the same version. A dry run races for nothing, so it
# waits only for other dry runs, never holding up a release.
concurrency:
  group: release${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

permissions:
  # The version commit, the tag, and the GitHub release.
  contents: write
  # npm provenance and trusted publishing.
  id-token: write

jobs:
  # The inputs, checked against npm before any slow job starts: see scripts/release-version.mjs.
  # Also that npm trusts this workflow to publish every package, so a release cannot stop part way
  # through publishing. Only Node, no install, so a refusal comes in seconds.
  validate:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        # Through the environment, so a typed version is never read as shell.
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs "$BUMP" "$VERSION"

  # Both native builds, on the commit being released, as every ready pull request and main has
  # them: see native.yml.
  native:
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    uses: ./.github/workflows/native.yml

  # The same gate CI runs, on exactly the commit being released. Its own job, so it runs beside
  # the slow checks rather than after them.
  verify:
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx run-many -t lint typecheck
      - timeout-minutes: 5
        run: pnpm --filter @ng-native/web exec playwright install chromium
      - run: pnpm coverage

  # One setup route in a fresh project: ng new with ng add, Nx's angular-monorepo preset with
  # nx add and the library generators, or the manual setup guide followed from its code blocks.
  # Too slow for every push, and exactly what a release of the schematics, the Nx plugin or the
  # Metro config plugin can break. One job each, side by side: the Nx one alone is about nine
  # minutes.
  generators:
    name: generators (${{ matrix.generator }})
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        generator: [angular, nx, manual]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # What Verdaccio fetched from npmjs for this generator's workspace, kept for a week: the
      # installs through a cold proxy are most of the job. Newer versions still arrive, since
      # Verdaccio asks npmjs for a package's versions again once its copy is two minutes old. Our
      # own scope is deleted, so only this run's publish can serve it.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .verdaccio/storage
          key: verdaccio-${{ matrix.generator }}-${{ steps.week.outputs.week }}
          restore-keys: verdaccio-${{ matrix.generator }}-
      - run: rm -rf .verdaccio/storage/@ng-native .verdaccio/storage/.verdaccio-db.json

      - name: Start a local registry
        run: |
          npx --yes verdaccio@6.10.5 --config verdaccio.yaml --listen 4873 > verdaccio.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:4873/-/ping > /dev/null && break; sleep 1; done
          token=$(curl -sf -XPUT -H 'Content-Type: application/json' \
            -d '{"name":"ci","password":"ci-password"}' \
            http://localhost:4873/-/user/org.couchdb.user:ci | jq -r .token)
          echo "//localhost:4873/:_authToken=$token" >> ~/.npmrc

      - run: node scripts/verify-publish.mjs --generators=${{ matrix.generator }}

      - if: failure()
        run: cat verdaccio.log

  # The Storybook recipe on the web docs, on the packages being released: built with
  # `storybook build` and checked in Chromium. It installs the Storybook and Vite versions the page
  # states, so a new Storybook release cannot fail ours.
  storybook:
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Start a local registry
        run: |
          npx --yes verdaccio@6.10.5 --config verdaccio.yaml --listen 4873 > verdaccio.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:4873/-/ping > /dev/null && break; sleep 1; done
          token=$(curl -sf -XPUT -H 'Content-Type: application/json' \
            -d '{"name":"ci","password":"ci-password"}' \
            http://localhost:4873/-/user/org.couchdb.user:ci | jq -r .token)
          echo "//localhost:4873/:_authToken=$token" >> ~/.npmrc

      - timeout-minutes: 5
        run: pnpm --filter @ng-native/web exec playwright install chromium

      - run: node scripts/verify-publish.mjs --storybook

      - if: failure()
        run: cat verdaccio.log

  release:
    needs: [validate, native, verify, generators, storybook]
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Version
        id: version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Lockstep: every package and the template move to the same version, in one commit and
          # one tag. `--preid` only matters for a bump; an exact version already carries it.
          npx nx release version "$VERSION" --preid alpha
          version=$(node -p "require('./packages/fabric/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # nx migrate and ng update run a migration when the upgrade crosses its version, so the
          # one that syncs each app's @ng-native versions moves to every release's. The others keep
          # the version of the release that brought them, or every upgrade would run them again.
          # Staged, so it goes into the release commit below.
          for file in packages/nx/migrations.json packages/schematics/migrations.json; do
            jq --arg v "$version" '(.generators // .schematics)["sync-app-versions"].version = $v' \
              "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            git add "$file"
          done
          # The version plans in .nx/version-plans become this release's CHANGELOG.md entry and are
          # deleted; the versions staged above go into the same `Release <version>` commit and tag.
          npx nx release changelog "$version"
          # A prerelease goes out under its own dist-tag, so `npm install` keeps resolving the last
          # stable release (or nothing, before the first) instead of an alpha.
          if [[ "$version" == *-* ]]; then
            echo "tag=$(echo "$version" | sed -E 's/^[^-]+-([a-z]+).*/\1/')" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm pack` is what turns `workspace:*` into the exact version; `npm publish` of the
      # tarball is what speaks npm's OIDC for provenance and trusted publishing.
      # The packages publish their `dist`: JavaScript and declarations, partial-compiled.
      - name: Build
        run: npx nx run-many -t build -p '@ng-native/*'

      - name: Pack
        run: |
          mkdir -p .release
          # Exactly what `nx release` versioned, so the two lists cannot drift apart.
          for project in $(jq -r '.release.projects[]' nx.json); do
            root=$(npx nx show project "$project" --json | jq -r .root)
            (cd "$root" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.release")
          done
          ls .release

      # No token: each package's trusted publisher on npmjs.com names this workflow, and npm
      # authenticates the publish through OIDC. `validate` checked that it does for every package.
      # A dry run packs and checks each tarball the same way and stops before the upload.
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '--provenance' }}
        run: |
          for tarball in .release/*.tgz; do
            name=$(tar -xOzf "$tarball" package/package.json | jq -r .name)
            # Already there means an earlier run got this far: skip it, so running again with the
            # same exact version finishes a release that failed part way through.
            if npm view "$name@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
              echo "already published: $name"
              continue
            fi
            npm publish "$tarball" "$DRY_RUN" --access public --tag '${{ steps.version.outputs.tag }}'
          done

      - name: Push the version commit and tag
        if: ${{ !inputs.dry_run }}
        run: |
          # Pull requests can merge while a release runs. Replay the release commit on top of them
          # and tag where it lands. A rebase conflict (a merge that touched a version, the
          # changelog or a migrations.json) fails the step rather than guessing.
          tag='v${{ steps.version.outputs.version }}'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            git tag -f -a "$tag" -m "$tag"
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          git push origin "refs/tags/$tag"

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This release's CHANGELOG.md entry, from its heading to the next release's.
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > .release/notes.md
          gh release create 'v${{ steps.version.outputs.version }}' \
            --notes-file .release/notes.md \
            ${{ steps.version.outputs.tag != 'latest' && '--prerelease' || '' }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Dry run of $VERSION on \`$TAG\`"
            echo
            echo 'Nothing was published, pushed or deployed. These tarballs would be published:'
            echo
            for tarball in .release/*.tgz; do echo "- \`$(basename "$tarball")\`"; done
            echo
            echo '### Changelog entry'
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2
          } >> "$GITHUB_STEP_SUMMARY"

  # The site goes live with the release it documents, built from the tag.
  docs:
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/docs.yml
    with:
      ref: v${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
