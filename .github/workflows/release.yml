name: Release

# Run by hand from the Actions tab, on main, once CI is green there. See docs/RELEASING.md.
# A dry run can start from any branch: every check and build runs, nothing leaves the runner.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'The bump: minor for a breaking change, patch otherwise'
        type: choice
        options: [minor, patch]
        required: true
        default: minor
      version:
        description: 'An exact version instead (0.19.0), above the latest on npm and on the same major. Overrides the bump.'
        required: false
        default: ''
      dry_run:
        description: 'A dry run: every check, build and pack, then `npm publish --dry-run`. Nothing is published, pushed or deployed.'
        type: boolean
        default: false

# One release at a time: two would race for the same version. A dry run races for nothing, so it
# waits only for other dry runs, never holding up a release.
concurrency:
  group: release${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

permissions:
  # The tag and the GitHub release. Nothing is pushed to `main`: see docs/RELEASING.md.
  contents: write
  # npm provenance and trusted publishing.
  id-token: write

jobs:
  # The inputs, checked against npm before any slow job starts: see scripts/release-version.mjs.
  # Also that npm trusts this workflow to publish every package, so a release cannot stop part way
  # through publishing. Only Node, no install, so a refusal comes in seconds.
  validate:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        # Through the environment, so a typed version is never read as shell.
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs "$BUMP" "$VERSION"

  # Both native builds on the commit being released, even for a docs-only change.
  native:
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native.yml

  # The same gate CI runs, on exactly the commit being released. Its own job, so it runs beside
  # the slow checks rather than after them.
  verify:
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx nx run-many -t lint typecheck
      - timeout-minutes: 5
        run: pnpm --filter @ng-native/web exec playwright install chromium
      - run: pnpm coverage

  # The prebuilt desktop hosts for each React Native version the packages support (HOST_REACT_NATIVE
  # in packages/desktop/bin/prebuilt.mjs, which this matrix and the Linux one list), both universal
  # and packed with their hermesc and Sparkle, so an app with no native desktop code of its own
  # compiles nothing (packages/desktop/bin/prebuilt.mjs): the debug host, the dev build `run` uses,
  # with React Native's debugger, and the release host, the Release build `package` ships. One job
  # each, side by side. Built against the canary, which has every host library but
  # react-native-webview. Signed ad hoc, so the job needs no secrets: an app re-signs the host when
  # it packages, and the download is checked by its SHA-256. The archives go up with the GitHub
  # release; their SHA-256s go into packages/desktop/prebuilt.json, inside the npm package, before
  # it is packed.
  desktop-host:
    name: desktop-host (${{ matrix.react-native }}, ${{ matrix.flavour }})
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: macos-latest
    strategy:
      matrix:
        react-native: ['0.88.1']
        flavour: [debug, release]
    # It builds fetched third-party sources, so it gets no write access, and its read-only token
    # goes only to the step that fetches main's host, before anything is built.
    permissions:
      contents: read
      actions: read
    # Unchanged inputs pack a kept host in under 2 minutes, and a change with ccache warm builds in
    # about 5 (dry runs 43990876531 and 43991351989). The limit is for the build from scratch that
    # anything the action cannot check falls back to: 50 minutes for release and 52 for debug, cold
    # and through ccache (dry run 43979954553).
    timeout-minutes: 75
    env:
      NGN_JOBS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The last release's prebuilt.json: `main` keeps the one it had before releases stopped
      # committing to it, and the reuse below compares against what the last release shipped.
      - name: The last release's prebuilt.json
        env:
          PREVIOUS: ${{ needs.validate.outputs.previous }}
        run: |
          git fetch --depth=1 origin "refs/tags/$PREVIOUS"
          git show FETCH_HEAD:packages/desktop/prebuilt.json > packages/desktop/prebuilt.json

      # The last release's archive when nothing it is built from changed, else a host kept from a
      # build with the same inputs, else a build through ccache: see the action.
      - uses: ./.github/actions/desktop-prebuilt
        with:
          react-native: ${{ matrix.react-native }}
          flavour: ${{ matrix.flavour }}
          version: ${{ needs.validate.outputs.version }}
          base-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.validate.outputs.version }}
          out: .prebuilt
          github-token: ${{ github.token }}

      # .prebuilt is a dot folder, which upload-artifact leaves out unless told otherwise.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-host-${{ matrix.react-native }}-${{ matrix.flavour }}
          path: .prebuilt
          include-hidden-files: true
          if-no-files-found: error

  # The prebuilt Linux hosts for the same React Native versions, both flavours, for x64 and arm64,
  # each built natively on its own runner in the AlmaLinux 9 image, so it needs glibc 2.34 at most.
  # Not signed: the download is checked by its SHA-256, which goes into prebuilt.json beside the
  # macOS hosts'.
  desktop-host-linux:
    name: desktop-host-linux (${{ matrix.react-native }}, ${{ matrix.arch }}, ${{ matrix.flavour }})
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    strategy:
      matrix:
        react-native: ['0.88.1']
        arch: [x64, arm64]
        flavour: [debug, release]
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The last release's prebuilt.json: `main` keeps the one it had before releases stopped
      # committing to it, and the reuse below compares against what the last release shipped.
      - name: The last release's prebuilt.json
        env:
          PREVIOUS: ${{ needs.validate.outputs.previous }}
        run: |
          git fetch --depth=1 origin "refs/tags/$PREVIOUS"
          git show FETCH_HEAD:packages/desktop/prebuilt.json > packages/desktop/prebuilt.json
      - uses: ./.github/actions/desktop-prebuilt-linux
        with:
          react-native: ${{ matrix.react-native }}
          flavour: ${{ matrix.flavour }}
          version: ${{ needs.validate.outputs.version }}
          base-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.validate.outputs.version }}
          out: .prebuilt
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-host-linux-${{ matrix.react-native }}-${{ matrix.arch }}-${{ matrix.flavour }}
          path: .prebuilt
          include-hidden-files: true
          if-no-files-found: error

  # One setup route in a fresh project: ng new with ng add, Nx's angular-monorepo preset with
  # nx add and the library generators, or the manual setup guide followed from its code blocks.
  # Too slow for every push, and exactly what a release of the schematics, the Nx plugin or the
  # Metro config plugin can break. One job each, side by side: the Nx one alone is about nine
  # minutes.
  generators:
    name: generators (${{ matrix.generator }})
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        generator: [angular, nx, manual]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # What Verdaccio fetched from npmjs for this generator's workspace, kept for a week: the
      # installs through a cold proxy are most of the job. Newer versions still arrive, since
      # Verdaccio asks npmjs for a package's versions again once its copy is two minutes old. Our
      # own scope is deleted, so only this run's publish can serve it.
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .verdaccio/storage
          key: verdaccio-${{ matrix.generator }}-${{ steps.week.outputs.week }}
          restore-keys: verdaccio-${{ matrix.generator }}-
      - run: rm -rf .verdaccio/storage/@ng-native .verdaccio/storage/.verdaccio-db.json

      - name: Start a local registry
        run: |
          npx --yes verdaccio@6.10.5 --config verdaccio.yaml --listen 4873 > verdaccio.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:4873/-/ping > /dev/null && break; sleep 1; done
          token=$(curl -sf -XPUT -H 'Content-Type: application/json' \
            -d '{"name":"ci","password":"ci-password"}' \
            http://localhost:4873/-/user/org.couchdb.user:ci | jq -r .token)
          echo "//localhost:4873/:_authToken=$token" >> ~/.npmrc

      - run: node scripts/verify-publish.mjs --generators=${{ matrix.generator }}

      - if: failure()
        run: cat verdaccio.log

  # The Storybook recipe on the web docs, on the packages being released: built with
  # `storybook build` and checked in Chromium. It installs the Storybook and Vite versions the page
  # states, so a new Storybook release cannot fail ours.
  storybook:
    needs: validate
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Start a local registry
        run: |
          npx --yes verdaccio@6.10.5 --config verdaccio.yaml --listen 4873 > verdaccio.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf localhost:4873/-/ping > /dev/null && break; sleep 1; done
          token=$(curl -sf -XPUT -H 'Content-Type: application/json' \
            -d '{"name":"ci","password":"ci-password"}' \
            http://localhost:4873/-/user/org.couchdb.user:ci | jq -r .token)
          echo "//localhost:4873/:_authToken=$token" >> ~/.npmrc

      - timeout-minutes: 5
        run: pnpm --filter @ng-native/web exec playwright install chromium

      - run: node scripts/verify-publish.mjs --storybook

      - if: failure()
        run: cat verdaccio.log

  release:
    needs: [validate, native, verify, generators, storybook, desktop-host, desktop-host-linux]
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # No credentials left in the git config: the build runs installed packages' code, and only
      # the tag push below gets a token. The repository is public, so fetching needs none.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      # Both flavours' archives and entries into one folder: their file names differ.
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-host-*
          merge-multiple: true
          path: .prebuilt

      - name: Version
        id: version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PREVIOUS: ${{ needs.validate.outputs.previous }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The release commit goes out only under its tag, never onto `main`, so `main` still has
          # the version plans earlier releases consumed: every plan the last release was made from
          # is dropped here. And the last release's prebuilt.json, which the hosts below go into.
          set -o pipefail
          git ls-tree --name-only "$PREVIOUS^" .nx/version-plans/ |
            xargs -r git rm -q --ignore-unmatch --
          git show "$PREVIOUS:packages/desktop/prebuilt.json" > packages/desktop/prebuilt.json
          # Lockstep: every package and the template move to the same version, in one commit and
          # one tag. `--preid` only matters for a bump; an exact version already carries it.
          npx nx release version "$VERSION" --preid alpha
          version=$(node -p "require('./packages/fabric/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # nx migrate and ng update run a migration when the upgrade crosses its version, so the
          # one that syncs each app's @ng-native versions moves to every release's. The others keep
          # the version of the release that brought them, or every upgrade would run them again.
          # Staged, so it goes into the release commit below.
          for file in packages/nx/migrations.json packages/schematics/migrations.json; do
            jq --arg v "$version" '(.generators // .schematics)["sync-app-versions"].version = $v' \
              "$file" > "$file.tmp" && mv "$file.tmp" "$file"
            git add "$file"
          done
          # Each prebuilt desktop host's entry, with its SHA-256, into the manifest
          # @ng-native/desktop ships, so the package names the archives the GitHub release below
          # serves: both flavours for macOS and for Linux on x64 and arm64, for each React Native
          # version (RELEASE_HOSTS). An entry
          # missing or for another host fails the step, so no release ships without one.
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { readManifest, withReleaseHosts } from './packages/desktop/bin/prebuilt.mjs';
            const file = 'packages/desktop/prebuilt.json';
            const manifest = withReleaseHosts(readManifest(readFileSync(file, 'utf8')), (name) =>
              readFileSync('.prebuilt/' + name, 'utf8'),
            );
            writeFileSync(file, JSON.stringify(manifest, null, 2) + '\\n');
          "
          git add packages/desktop/prebuilt.json
          # The version plans left in .nx/version-plans become this release's notes, in a CHANGELOG.md
          # that only this runner has; the versions staged above go into the `Release <version>`
          # commit and tag Nx makes here, of which only the tag is pushed.
          npx nx release changelog "$version"
          # A prerelease goes out under its own dist-tag, so `npm install` keeps resolving the last
          # stable release (or nothing, before the first) instead of an alpha.
          if [[ "$version" == *-* ]]; then
            echo "tag=$(echo "$version" | sed -E 's/^[^-]+-([a-z]+).*/\1/')" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # `pnpm pack` is what turns `workspace:*` into the exact version; `npm publish` of the
      # tarball is what speaks npm's OIDC for provenance and trusted publishing.
      # The packages publish their `dist`: JavaScript and declarations, partial-compiled.
      - name: Build
        run: npx nx run-many -t build -p '@ng-native/*'

      - name: Pack
        run: |
          mkdir -p .release
          # Exactly what `nx release` versioned, so the two lists cannot drift apart.
          for project in $(jq -r '.release.projects[]' nx.json); do
            root=$(npx nx show project "$project" --json | jq -r .root)
            (cd "$root" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/.release")
          done
          ls .release

      # No token: each package's trusted publisher on npmjs.com names this workflow, and npm
      # authenticates the publish through OIDC. `validate` checked that it does for every package.
      # A dry run packs and checks each tarball the same way and stops before the upload.
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '--provenance' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A new run builds new desktop hosts, whose archives have other SHA-256s. When an earlier
          # run already published @ng-native/desktop at this version, its prebuilt.json names that
          # run's archives, and attaching these would fail every download: stop instead. Re-run
          # the failed jobs of the earlier run, which keeps its hosts.
          if npm view "@ng-native/desktop@$VERSION" version > /dev/null 2>&1; then
            published=$(mktemp -d)
            npm pack "@ng-native/desktop@$VERSION" --pack-destination "$published" > /dev/null
            if ! tar -xOzf "$published"/*.tgz package/prebuilt.json | jq -S . |
              cmp -s - <(jq -S . packages/desktop/prebuilt.json); then
              echo "::error::@ng-native/desktop@$VERSION is already published with another prebuilt desktop host. Re-run the failed jobs of the run that published it, which keeps its host, instead of starting a new run."
              exit 1
            fi
          fi
          for tarball in .release/*.tgz; do
            name=$(tar -xOzf "$tarball" package/package.json | jq -r .name)
            # Already there means an earlier run got this far: skip it, so running again with the
            # same exact version finishes a release that failed part way through.
            if npm view "$name@${{ steps.version.outputs.version }}" version > /dev/null 2>&1; then
              echo "already published: $name"
              continue
            fi
            npm publish "$tarball" "$DRY_RUN" --access public --tag '${{ steps.version.outputs.tag }}'
          done

      # Only the tag: nothing on `main` needs the release commit, so the release never pushes there.
      - name: Push the tag
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          git remote set-url origin "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push origin 'refs/tags/v${{ steps.version.outputs.version }}'

      - name: GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This release's CHANGELOG.md entry, from its heading to the next release's.
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > .release/notes.md
          gh release create 'v${{ steps.version.outputs.version }}' \
            --notes-file .release/notes.md \
            .prebuilt/*.tar.gz \
            ${{ steps.version.outputs.tag != 'latest' && '--prerelease' || '' }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Dry run of $VERSION on \`$TAG\`"
            echo
            echo 'Nothing was published, pushed or deployed. These tarballs would be published:'
            echo
            for tarball in .release/*.tgz; do echo "- \`$(basename "$tarball")\`"; done
            echo
            echo 'These prebuilt desktop hosts would go up with the GitHub release:'
            echo
            for archive in .prebuilt/*.tar.gz; do echo "- \`$(basename "$archive")\`"; done
            echo
            echo 'With these entries in packages/desktop/prebuilt.json:'
            echo
            echo '```json'
            cat packages/desktop/prebuilt.json
            echo '```'
            echo
            echo '### Changelog entry'
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2
          } >> "$GITHUB_STEP_SUMMARY"

  # The site goes live with the release it documents, built from the tag.
  docs:
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/docs.yml
    with:
      ref: v${{ needs.release.outputs.version }}
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
