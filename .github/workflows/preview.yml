name: Preview

# When distribution inputs change, build every package `nx release` publishes and send it to pkg.pr.new,
# so a change can be installed and tried before it is released. The pkg.pr.new GitHub app posts
# the install commands as one comment on the pull request and updates it on each push.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      published: ${{ steps.classify.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - uses: ./.github/actions/ci-changes
        id: classify
        with:
          token: ${{ github.token }}

  publish:
    needs: changes
    if: >-
      !cancelled() && github.event.pull_request.draft != true &&
      needs.changes.outputs.published != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npx nx run-many -t build -p '@ng-native/*'

      # The same list the release packs, so the two cannot drift apart. `--pnpm` packs with pnpm,
      # which turns `workspace:*` into a version; pkg.pr.new then points each package's
      # dependencies and peer dependencies on the others at this build's previews.
      - name: Publish to pkg.pr.new
        run: |
          # One assignment per project, so a failed lookup stops the step instead of dropping a
          # package from the list.
          roots=()
          for project in $(jq -r '.release.projects[]' nx.json); do
            roots+=("$(npx nx show project "$project" --json | jq -er .root)")
          done
          npx --yes pkg-pr-new@0.0.93 publish --pnpm --peerDeps --packageManager=pnpm,npm "${roots[@]}"
